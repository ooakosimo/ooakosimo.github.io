<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Vibe Coding: Crazy Jazz Bot Dance</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #f5f5f5;
  overflow: hidden;
  font-family: 'Courier New', Courier, monospace;
}

#drawingView, #threeView {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Drawing */
#drawingView {
  flex-direction: column;
  z-index: 10;
  background: #f5f5f5;
  transition: opacity 0.8s ease;
}

#drawingView img {
  max-width: 90%;
  max-height: 70%;
  background: white;
  padding: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  transform: rotate(-1deg);
}

#hint {
  margin-top: 14px;
  font-size: 13px;
  opacity: 0.6;
  letter-spacing: 1px;
}

#enterBtn {
  margin-top: 26px;
  width: 64px;
  height: 64px;
  font-size: 26px;
  border: 2px solid #333;
  border-radius: 50%;
  background: #222;
  color: #fff;
  cursor: pointer;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%,100% { transform: scale(1); opacity: 0.9; }
  50% { transform: scale(1.05); opacity: 1; }
}

/* Three */
#threeView {
  opacity: 0;
  pointer-events: none;
  transition: opacity 1.2s ease;
}

#threeView.visible {
  opacity: 1;
  pointer-events: auto;
}

/* Back */
#backBtn {
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 20;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  background: #222;
  color: white;
  font-size: 18px;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.6s ease;
}

#backBtn.visible {
  opacity: 1;
  pointer-events: auto;
}

.hidden {
  opacity: 0;
  pointer-events: none;
}

/* --- NEW: VIDEO & MEDIA CONTROLS --- */
#mediaControls {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 30;
  display: flex;
  gap: 15px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1s ease;
}

#mediaControls.visible {
  opacity: 1;
  pointer-events: auto;
}

.media-btn {
  background: rgba(255, 255, 255, 0.9);
  border: 2px solid #222;
  padding: 12px 24px;
  border-radius: 30px;
  font-family: 'Courier New', monospace;
  font-weight: bold;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  transition: transform 0.2s, background 0.2s;
}

.media-btn:hover {
  transform: scale(1.1);
  background: #fff;
  color: #000;
}

/* Full Screen Overlay */
#videoOverlay {
  position: fixed;
  inset: 0;
  background: black;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
}

#videoOverlay.active {
  opacity: 1;
  pointer-events: auto;
}

#videoOverlay video {
  max-width: 100%;
  max-height: 100%;
  display: none; /* Hidden by default */
}

#closeVideo {
  position: absolute;
  top: 20px;
  right: 20px;
  color: white;
  border: 2px solid white;
  background: transparent;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
  z-index: 60;
}
</style>
</head>

<body>

<div id="drawingView">
  <img src="drawing.jpg" alt="original sketch" onerror="this.style.display='none'; document.body.insertAdjacentHTML('afterbegin', '<h2>Missing drawing.jpg</h2>')">
  <div id="hint">THE CHAOS SESSION</div>
  <button id="enterBtn">▶</button>
</div>

<div id="threeView"></div>
<button id="backBtn">II</button>

<div id="mediaControls">
  <button class="media-btn" onclick="playVideo('grok')">Grok</button>
  <button class="media-btn" onclick="playVideo('gemini')">Gemini</button>
</div>

<div id="videoOverlay">
  <button id="closeVideo" onclick="closeVideo()">X</button>
  <video id="vid-grok" src="https://ooakosimo.neocities.org/grok_remix.mp4" controls playsinline loop></video>
  <video id="vid-gemini" src="https://ooakosimo.neocities.org/gemini_remix.mp4" controls playsinline loop></video>
</div>

<script>
// ----------------------------------------------------------------
// 1. VISUALS (CRAZY VERSION)
// ----------------------------------------------------------------
let scene, camera, renderer, clock;
let creature, leftEye, rightEye, vortexGroup;
let legs = [];
let mouse = new THREE.Vector2();
let animating = false;

// ----------------------------------------------------------------
// 2. AUDIO ENGINE (JAZZ VERSION)
// ----------------------------------------------------------------
let audioCtx;
let isPlaying = false;
let nextNoteTime = 0.0;
let rhythmIndex = 0;
let tempo = 138; // Faster tempo for chaos

/* DOM & UI */
const enterBtn = document.getElementById('enterBtn');
const backBtn = document.getElementById('backBtn');
const drawingView = document.getElementById('drawingView');
const threeView = document.getElementById('threeView');

enterBtn.onclick = () => {
  // Start Audio
  if(!audioCtx) initAudioSystem();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  
  // Start Visuals
  drawingView.classList.add('hidden');
  if (!renderer) initVisuals();
  threeView.classList.add('visible');
  backBtn.classList.add('visible');
  
  animating = true;
  isPlaying = true;
  
  scheduler(); // Start Jazz
  animate();   // Start Chaos
  
  document.getElementById('mediaControls').classList.add('visible'); // <--- ADD THIS LINE
};


backBtn.onclick = () => {
  animating = false;
  isPlaying = false;
  threeView.classList.remove('visible');
  backBtn.classList.remove('visible');
  drawingView.classList.remove('hidden');
  
document.getElementById('mediaControls').classList.remove('visible'); // <--- ADD THIS LINE
};  



// ----------------------------------------------------------------
// AUDIO GENERATORS (JAZZ)
// ----------------------------------------------------------------

function initAudioSystem() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function scheduler() {
  if (!isPlaying) return;
  while (nextNoteTime < audioCtx.currentTime + 0.1) {
    scheduleBeat(nextNoteTime);
    nextNoteTime += (60.0 / tempo) * 0.5 + (Math.random() * 0.04); // Swing/Slop
  }
  setTimeout(scheduler, 25);
}

function scheduleBeat(time) {
  // 1. RIDE CYMBAL (Manic)
  if (Math.random() > 0.1) playCymbal(time);
  
  // 2. SNARE (Random accents)
  if (Math.random() > 0.75) playSnare(time, 0.3);
  if (rhythmIndex % 8 === 4 && Math.random() > 0.2) playSnare(time, 0.9);

  // 3. BASS (Walking fast)
  if (rhythmIndex % 2 === 0) {
    const freq = (Math.random() > 0.4) ? 65.41 : 98.00; 
    playBass(time, freq);
  }

  // 4. TRUMPET (Screaming)
  if (Math.random() > 0.88) {
    const scale = [196, 233, 261, 293, 349, 392, 466, 523]; 
    const note = scale[Math.floor(Math.random() * scale.length)];
    playTrumpet(time, note, 0.2 + Math.random() * 1.0);
  }

  rhythmIndex++;
}

// --- INSTRUMENTS ---
function createNoiseBuffer() {
  const bufferSize = audioCtx.sampleRate * 2;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const output = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
  return buffer;
}

function playCymbal(time) {
  const osc = audioCtx.createBufferSource();
  osc.buffer = createNoiseBuffer();
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.value = 6000;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.08, time);
  gain.gain.exponentialRampToValueAtTime(0.01, time + 0.2);
  osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  osc.start(time); osc.stop(time + 0.2);
}

function playSnare(time, vol) {
  const osc = audioCtx.createBufferSource();
  osc.buffer = createNoiseBuffer();
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 1800;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(vol * 0.25, time);
  gain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
  osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  osc.start(time); osc.stop(time + 0.1);
}

function playBass(time, freq) {
  const osc = audioCtx.createOscillator();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(freq, time);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.35, time);
  gain.gain.exponentialRampToValueAtTime(0.01, time + 0.6);
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 350;
  osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  osc.start(time); osc.stop(time + 0.6);
}

function playTrumpet(time, freq, duration) {
  const osc = audioCtx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(freq, time);
  osc.frequency.linearRampToValueAtTime(freq * 0.99, time + duration); // Drift
  
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0, time);
  gain.gain.linearRampToValueAtTime(0.12, time + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.01, time + duration);

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(800, time);
  filter.frequency.linearRampToValueAtTime(2500, time + 0.15); // Wah

  const delay = audioCtx.createDelay();
  delay.delayTime.value = 0.35;
  const delayGain = audioCtx.createGain();
  delayGain.gain.value = 0.3;

  osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  gain.connect(delay); delay.connect(delayGain); delayGain.connect(audioCtx.destination); delayGain.connect(delay);
  
  osc.start(time); osc.stop(time + duration + 1);
}


// ----------------------------------------------------------------
// 3. VISUALS LOGIC (CRAZY VERSION)
// ----------------------------------------------------------------
function initVisuals() {
  clock = new THREE.Clock();

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf5f5f5);
  scene.fog = new THREE.FogExp2(0xf5f5f5, 0.08);

  camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
  setCameraForScreen();

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
  threeView.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.9));
  const d = new THREE.DirectionalLight(0xffffff, 0.4);
  d.position.set(5,10,5);
  scene.add(d);

  buildCreature();
  buildVortex();

  window.addEventListener('mousemove', onPointerMove);
  window.addEventListener('touchmove', onTouchMove, { passive:false });
  window.addEventListener('resize', onResize);
}

const wireMat = new THREE.MeshBasicMaterial({ color: 0x222222, wireframe:true });
const solidMat = new THREE.MeshBasicMaterial({ color: 0x111111 });

function buildCreature() {
  creature = new THREE.Group();
  creature.add(new THREE.Mesh(new THREE.BoxGeometry(2.2,1.4,1.2), wireMat));
  const top = new THREE.Mesh(new THREE.BoxGeometry(1.2,0.4,0.8), wireMat);
  top.position.y = 1;
  creature.add(top);

  leftEye = buildEye();
  rightEye = buildEye();
  leftEye.position.set(-0.4,1.5,0);
  rightEye.position.set(0.4,1.5,0);
  creature.add(leftEye, rightEye);

  legs.push(buildLeg(-0.6), buildLeg(0.6));
  legs.forEach(l => creature.add(l));

  creature.position.set(-1,0,0);
  scene.add(creature);
}


function buildEye() {
  const g = new THREE.Group();
  const stalk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.02,0.02,0.8,6), solidMat
  );
  stalk.position.y = 0.4;
  g.add(stalk);

  const eye = new THREE.Mesh(
    new THREE.BoxGeometry(0.35,0.22,0.22), wireMat
  );
  eye.position.y = 0.9;
  g.add(eye);

  const pupil = new THREE.Mesh(
    new THREE.SphereGeometry(0.06,8,8), solidMat
  );
  pupil.position.set(0,0.9,0.12);
  g.add(pupil);

  g.userData.pupil = pupil;
  return g;
}

function buildLeg(x) {
  const g = new THREE.Group();
  const shaft = new THREE.Mesh(
    new THREE.CylinderGeometry(0.04,0.04,1.4,6), solidMat
  );
  shaft.position.y = -1.1;
  g.add(shaft);

  const foot = new THREE.Mesh(
    new THREE.BoxGeometry(0.5,0.1,0.3), wireMat
  );
  foot.position.y = -1.85;
  g.add(foot);

  g.position.x = x;
  return g;
}

function buildVortex() {
  vortexGroup = new THREE.Group();
  for (let i=0;i<16;i++){
    const pts=[];
    const baseR = 0.4 + i*0.15;
    for(let a=0;a<=Math.PI*2;a+=0.12) pts.push(new THREE.Vector3(Math.cos(a)*baseR, Math.sin(a)*baseR, 0));
    const line = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), 
      new THREE.LineBasicMaterial({ color: 0x333333, transparent:true, opacity: 0.55 }));
    line.userData.baseR = baseR;
    line.userData.phase = Math.random()*Math.PI*2;
    vortexGroup.add(line);
  }
  scene.add(vortexGroup);
  positionVortex();
}

function animate() {
  if (!animating) return;
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // --- THE CHAOS IS BACK ---
  creature.position.y = Math.abs(Math.sin(t*2))*0.4 + Math.sin(t*18)*0.08;
  creature.rotation.y = Math.sin(t*0.7)*0.4 + (Math.random()-0.5)*0.05;
  creature.rotation.z = Math.sin(t*6)*0.15;

  legs.forEach((l,i)=>{
    l.rotation.z = Math.sin(t*6+i)*0.6 + Math.sin(t*20+i)*0.2;
  });

  [leftEye,rightEye].forEach(e=>{
    const p=e.userData.pupil;
    const jitter=(Math.random()-0.5)*0.06;
    p.position.x=THREE.MathUtils.lerp(p.position.x,mouse.x*0.15+jitter,0.15);
    p.position.y=THREE.MathUtils.lerp(p.position.y,0.9+mouse.y*0.1+jitter,0.15);
  });

  vortexGroup.rotation.z -= 0.03;
  vortexGroup.children.forEach((l,i)=>{
    const pulse = Math.sin(t*4 + l.userData.phase)*0.25;
    const glitch = (Math.random()<0.04) ? (Math.random()*0.4) : 0;
    l.scale.setScalar(1 + pulse + glitch);
    l.rotation.z += Math.sin(t*2+i)*0.002;
  });

  renderer.render(scene,camera);
}

/* Utils */
function setCameraForScreen(){
  const portrait = innerHeight > innerWidth;
  camera.position.set(0, portrait?2.8:2.2, portrait?11.5:9);
  camera.lookAt(0,0.6,0);
}
function positionVortex(){
  const portrait = innerHeight > innerWidth;
  vortexGroup.position.set(portrait?0:2, 1.4, -2);
}
function onPointerMove(e){ mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1; }
function onTouchMove(e){ 
  const t=e.touches[0];
  mouse.x=(t.clientX/innerWidth)*2-1; mouse.y=-(t.clientY/innerHeight)*2+1; 
}
function onResize(){
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  setCameraForScreen();
  positionVortex();
}

/* --- NEW VIDEO LOGIC --- */
function playVideo(type) {
  // 1. Pause the Jazz (Audio & Animation)
  if(audioCtx && audioCtx.state === 'running') audioCtx.suspend();
  animating = false;

  // 2. Show Overlay
  const overlay = document.getElementById('videoOverlay');
  const vGrok = document.getElementById('vid-grok');
  const vGem = document.getElementById('vid-gemini');
  
  overlay.classList.add('active');
  
  // 3. Play selected video
  if (type === 'grok') {
    vGrok.style.display = 'block';
    vGem.style.display = 'none';
    vGrok.currentTime = 0;
    vGrok.play();
  } else {
    vGem.style.display = 'block';
    vGrok.style.display = 'none';
    vGem.currentTime = 0;
    vGem.play();
  }
}

function closeVideo() {
  // 1. Hide Overlay
  document.getElementById('videoOverlay').classList.remove('active');
  
  // 2. Stop Videos
  const vGrok = document.getElementById('vid-grok');
  const vGem = document.getElementById('vid-gemini');
  vGrok.pause();
  vGem.pause();

  // 3. Resume Jazz
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  animating = true;
  animate();
}
</script>
</body>
</html>
