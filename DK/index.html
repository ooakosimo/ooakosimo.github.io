<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dirty Kitchen v7</title>
<link rel="icon" href="/gumamela.gif" type="image/gif">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&family=Mr+Dafoe&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f6e9ff; --muted:#b9a3cf; --pink:#ff4fd0; --cyan:#3ff0ff; --panel:rgba(18,8,30,.78); --line:rgba(255,79,208,.28);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:inherit}
html,body{height:100%; margin:0}
body{background:#140a24; color:var(--ink); font-family:"Chakra Petch",system-ui,sans-serif; overflow:hidden}
canvas{display:block; position:fixed; inset:0; width:100%; height:100%; touch-action:none; outline:none}
.hud{
  position:fixed; left:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); width:min(290px, calc(100vw - 24px));
  background:var(--panel); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line); border-radius:14px; padding:10px 14px 12px;
}
.head{display:flex; align-items:center; justify-content:space-between}
h1{margin:0; font-family:"Mr Dafoe",cursive; font-weight:400; font-size:38px; line-height:1; color:var(--pink); text-shadow:0 0 8px rgba(255,79,208,.8), 0 0 22px rgba(255,79,208,.45)}
.hint{font-size:12.5px; line-height:1.45; color:var(--muted); margin:6px 0 10px}
.btns{display:flex; gap:6px; flex-wrap:wrap}
button{font:600 12.5px/1 "Chakra Petch",system-ui,sans-serif; padding:8px 12px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer}
button[aria-pressed="true"]{background:var(--pink); color:#1b0626; border-color:var(--pink)}
button:focus-visible{outline:2px solid var(--cyan); outline-offset:2px}
button:disabled{opacity:.35; cursor:default}
.fold{padding:4px 10px; font-size:16px}
.hud.collapsed #hudBody{display:none}
.pad{position:fixed; right:14px; bottom:calc(14px + env(safe-area-inset-bottom,0px)); display:grid; grid-template-columns:repeat(3,54px); grid-template-rows:repeat(2,54px); gap:6px; user-select:none; -webkit-user-select:none}
.pad[hidden]{display:none}
.pad button{width:54px; height:54px; padding:0; font-size:20px; border-radius:12px; background:var(--panel); touch-action:none}
.pad{grid-template-columns:repeat(4,54px)}
.pad .up{grid-column:2; grid-row:1}
.pad .row2{grid-row:2}
.pad .fly{grid-column:1; grid-row:1; font-size:12px}
.pad .jump{grid-column:4; grid-row:1; font-size:12px}
.pad .lower{grid-column:4; grid-row:2; font-size:12px}
.pad .lower[hidden]{display:none}
.pad .fly[aria-pressed="true"]{background:var(--cyan); color:#06202a; border-color:var(--cyan)}
.flyind{position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%); background:var(--panel); border:1px solid var(--cyan); color:var(--cyan); border-radius:999px; padding:5px 12px; font-size:12px; font-weight:600; letter-spacing:.06em}
.flyind[hidden]{display:none}
body.clean .flyind{display:none}
.flash{position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none}
.static{position:fixed; inset:0; width:100%; height:100%; opacity:0; pointer-events:none; image-rendering:pixelated}
.caption{position:fixed; left:50%; bottom:22%; transform:translateX(-50%); font:600 18px/1.2 "Chakra Petch",system-ui,sans-serif; letter-spacing:.06em; color:#fff; text-shadow:0 0 8px #000,0 0 2px #000; pointer-events:none; white-space:nowrap}
.stripov{position:fixed; right:18px; bottom:18%; width:64px; transform:translateX(160%) rotate(4deg); transition:transform .7s cubic-bezier(.2,.8,.2,1); box-shadow:0 6px 18px rgba(0,0,0,.5); pointer-events:none}
.stripov.show{transform:translateX(0) rotate(4deg)}
.stripov img{display:block; width:100%}
body.clean .caption, body.clean .stripov{display:none}
@media (prefers-reduced-motion: reduce){ .stripov{transition:none} }
.sky{display:flex; gap:4px; flex-wrap:wrap; align-items:center; margin-top:8px}
.sky span{font-size:11.5px; color:var(--muted); margin-right:2px}
.sky button{padding:6px 9px; font-size:11.5px}
@media (max-width: 640px){
  body.walking .hud{bottom:auto; top:calc(10px + env(safe-area-inset-top,0px))}
  body.walking .flyind{top:auto; left:auto; right:14px; transform:none; bottom:calc(14px + 124px + env(safe-area-inset-bottom,0px))}
}
.load{position:fixed; inset:0; display:grid; place-items:center; background:#140a24; color:var(--pink); font-family:"Mr Dafoe",cursive; font-size:40px; transition:opacity .8s}
.load.done{opacity:0; pointer-events:none}
.msgs{position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); right:10px; width:min(330px, calc(100vw - 20px)); max-height:45vh; overflow:auto; display:flex; flex-direction:column; gap:6px; z-index:5}
.msg{display:flex; gap:8px; align-items:flex-start; background:var(--panel); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:1px solid rgba(255,90,90,.55); border-radius:10px; padding:7px 8px 7px 11px; font-size:12px; line-height:1.4}
.msg b{color:#ff8a8a}
.msg small{display:block; color:var(--muted); word-break:break-all}
.msg button{padding:2px 7px; font-size:13px; flex:none; margin-left:auto}
.fade{position:fixed; inset:0; background:#000; opacity:0; pointer-events:none}
body.clean .hud, body.clean .pad, body.clean .msgs{display:none}
body.clean canvas{cursor:none}
@media (prefers-reduced-motion: reduce){ .load{transition:none} }
</style>
</head>
<body>
<div class="load" id="load">lighting the uling…</div>
<div class="hud" id="hud" role="region" aria-label="Scene controls">
  <div class="head">
    <h1>Dirty Kitchen</h1>
    <button class="fold" id="fold" aria-expanded="true" aria-controls="hudBody" aria-label="Hide panel" title="Hide panel (M)">–</button>
  </div>
  <div id="hudBody">
    <p class="hint" id="hint"></p>
    <div class="btns">
      <button id="bWalk" aria-pressed="false">Walk</button>
      <button id="bKitchen">Kitchen</button>
      <button id="bSpeak">Speakeasy</button>
      <button id="bBeach">Beach</button>
      <button id="bTour" aria-pressed="false" title="Cinematic tour (T)">Tour</button>
      <button id="bLoop" aria-pressed="true" title="Loop the tour">Loop</button>
      <button id="bNums" aria-pressed="false" title="Frame numbers (N)">Frame numbers</button>
      <button id="bClean" aria-pressed="false" title="Hide all UI for recording (C)">Clean mode</button>
    </div>
    <div class="sky" role="group" aria-label="Day/Night">
      <span>Day/Night</span>
      <button data-tod="auto" aria-pressed="true" title="Slow cycle, about 8 minutes">Auto</button>
      <button data-tod="0" aria-pressed="false">Dawn</button>
      <button data-tod="1" aria-pressed="false">Day</button>
      <button data-tod="2" aria-pressed="false">Dusk</button>
      <button data-tod="3" aria-pressed="false">Night</button>
    </div>
  </div>
</div>
<div class="pad" id="pad" hidden>
  <button class="up" data-k="f" aria-label="Forward">▲</button>
  <button class="row2" data-k="l" aria-label="Turn left">◀</button>
  <button class="row2" data-k="b" aria-label="Back">▼</button>
  <button class="row2" data-k="r" aria-label="Turn right">▶</button>
  <button class="fly" id="bFly" aria-pressed="false" aria-label="Fly mode (F)">Fly</button>
  <button class="jump" id="bJump" data-k="u" aria-label="Jump (Space)">Jump</button>
  <button class="lower" id="bLower" data-k="d" aria-label="Lower (Shift)" hidden>Lower</button>
</div>
<div class="flyind" id="flyInd" role="status" hidden>✈ flying</div>
<div class="msgs" id="msgs" role="status" aria-live="polite"></div>
<div class="fade" id="fade" aria-hidden="true"></div>
<div class="flash" id="flashOv" aria-hidden="true"></div>
<canvas class="static" id="staticOv" width="160" height="90" aria-hidden="true"></canvas>
<div class="caption" id="caption" aria-live="polite"></div>
<div class="stripov" id="stripOv" aria-hidden="true"><img alt=""></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(() => {
'use strict';
// ================================================================ EDIT ME
const SIGN_TEXT = 'Dirty Kitchen';     // neon sign over the mural
const MARQUEE_TEXT = 'HAT MACHINE';    // arcade cabinet 1
const MARQUEE_TEXT_2 = 'MD WAS RUDE';  // arcade cabinet 2
// Your art: each entry is [frameNumber, url]. Turn on "Frame numbers" to see which number each frame has.
// Images (png/jpg/webp) or videos (mp4/webm). Animated GIFs only show their first frame in 3D, so convert them to mp4.
// The host must allow cross-origin loading (GitHub Pages does). If a link fails, a message on screen says which frame and why.
// Frames you don't list keep their placeholder cards. You can also drag files onto the page to preview.
const ART = [
  // [7, 'https://ooakosimo.neocities.org/cards/x.mp4'],
  // [12, 'https://ooakosimo.github.io/cards/card02.png'],
];
const NEON = { pink: '#ff2fb0', cyan: '#2fe6ff', warm: '#ffb766' };

// ================================================================ setup
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.domElement.tabIndex = 0;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#140a24');
scene.fog = new THREE.Fog('#140a24', 12, 60);   // colour + distances follow the time of day
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.04, 200);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = 1.48; controls.minDistance = 0.6; controls.maxDistance = 30;

let composer = null, bloom = null;
if (THREE.EffectComposer && THREE.UnrealBloomPass && THREE.RenderPass) {
  // the bloom pass renders into an offscreen target; give it a 24-bit depth buffer (WebGL2) so the big v6 world doesn't z-fight
  const sz = renderer.getSize(new THREE.Vector2()).multiplyScalar(renderer.getPixelRatio());
  const rt = new THREE.WebGLRenderTarget(sz.x, sz.y, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat });
  if (renderer.capabilities.isWebGL2) { rt.depthTexture = new THREE.DepthTexture(sz.x, sz.y); rt.depthTexture.type = THREE.UnsignedIntType; }
  composer = new THREE.EffectComposer(renderer, rt);
  composer.addPass(new THREE.RenderPass(scene, camera));
  bloom = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.95, 0.5, 0.85);
  composer.addPass(bloom);
}

// ================================================================ helpers
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const std = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.85, metalness: 0 }, o));
const glow = c => { const m = new THREE.MeshBasicMaterial({ color: c }); m.color.multiplyScalar(2.2); return m; };   // >1 = glows under bloom
function ctex(w, h, draw, rx = 1, ry = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = 4;
  return t;
}
function speckle(g, w, h, n, cols, s = 3) { for (let i = 0; i < n; i++) { g.fillStyle = cols[i % cols.length]; g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * s, 1 + rnd() * s); } }
function boxB(w, h, d, mat, x, y, z, parent = scene) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y + h / 2, z); parent.add(m); return m; }
function cyl(rt, rb, h, mat, x, y, z, seg = 16, parent = scene) { const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat); m.position.set(x, y + h / 2, z); parent.add(m); return m; }
function plane(w, h, mat, x, y, z, ry = 0, parent = scene) { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat); m.position.set(x, y, z); m.rotation.y = ry; parent.add(m); return m; }
const blockers = [];
const block = (x0, x1, z0, z1, y0 = 0, y1 = Infinity) => blockers.push([x0, x1, z0, z1, y0, y1]);   // y range optional: default blocks at every height, like a wall

// ================================================================ textures
const dirtT = ctex(256, 256, (g, w, h) => { g.fillStyle = '#2a281e'; g.fillRect(0, 0, w, h); speckle(g, w, h, 1400, ['#38361f', '#1c1b14', '#2f3a26', '#433d2a']); }, 7, 7);
const concT = ctex(256, 256, (g, w, h) => { g.fillStyle = '#86827b'; g.fillRect(0, 0, w, h); speckle(g, w, h, 1600, ['#7a766f', '#938f88', '#6d6962'], 2); }, 3, 3);
const blockCanvasDraw = (g, w, h) => {
  g.fillStyle = '#7f7b73'; g.fillRect(0, 0, w, h); speckle(g, w, h, 1500, ['#8e8a82', '#706c65', '#797269'], 2);
  g.strokeStyle = '#5c5851'; g.lineWidth = 5;
  for (let r = 0; r < 4; r++) {
    const y = r * 64; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke();
    for (let x = (r % 2 ? 64 : 0); x <= w; x += 128) { g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 64); g.stroke(); }
  }
};
function blockMat(w, h) { const t = ctex(256, 256, blockCanvasDraw, w / 0.5, h / 0.5); return std('#ffffff', { map: t }); }
const corrT = ctex(128, 128, (g, w, h) => {
  for (let x = 0; x < w; x++) { const v = 120 + Math.sin(x / w * Math.PI * 8) * 40; g.fillStyle = `rgb(${v},${v - 6},${v - 14})`; g.fillRect(x, 0, 1, h); }
  speckle(g, w, h, 160, ['rgba(140,70,30,.55)', 'rgba(90,45,20,.5)'], 6);
}, 6, 1);
const banigT = ctex(256, 256, (g, w, h) => {
  const cols = ['#c9a86a', '#a8322d', '#2f6b4a', '#e2cf9a', '#6b3a7a'];
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    const d = Math.abs(((x + y) % 8) - 4);
    g.fillStyle = (x + y) % 2 ? cols[d % cols.length] : cols[(d + 3) % cols.length];
    g.fillRect(x * 16, y * 16, 16, 16);
    g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(x * 16, y * 16 + ((x % 2) ? 0 : 8), 16, 2);
  }
});
const gridT = ctex(256, 256, (g, w, h) => {
  g.fillStyle = '#0c0417'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#ff2fb0'; g.lineWidth = 5; g.strokeRect(0, 0, w, h);
  g.strokeStyle = 'rgba(47,230,255,.55)'; g.lineWidth = 2; g.beginPath(); g.moveTo(w / 2, 0); g.lineTo(w / 2, h); g.moveTo(0, h / 2); g.lineTo(w, h / 2); g.stroke();
}, 9, 9);
function drawSunset(g, w, h, t = 0, withGrid = true) {
  const hz = h * 0.62;
  const sky = g.createLinearGradient(0, 0, 0, hz); sky.addColorStop(0, '#12052a'); sky.addColorStop(0.55, '#5b1272'); sky.addColorStop(1, '#ff3d8b');
  g.fillStyle = sky; g.fillRect(0, 0, w, hz);
  const r = h * 0.3, cx = w / 2, cy = hz - r * 0.15;
  const sun = g.createLinearGradient(0, cy - r, 0, cy + r); sun.addColorStop(0, '#ffe66b'); sun.addColorStop(1, '#ff2f8f');
  g.save(); g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.clip(); g.fillStyle = sun; g.fillRect(cx - r, cy - r, r * 2, r * 2);
  g.fillStyle = '#6a1477'; for (let i = 0; i < 6; i++) { const y = cy + i * r * 0.17; g.fillRect(cx - r, y, r * 2, 1 + i * r * 0.025); }
  g.restore();
  g.fillStyle = '#1a0630'; g.beginPath(); g.moveTo(0, hz);
  const peaks = [[0.08, 0.72], [0.17, 0.82], [0.27, 0.66], [0.38, 0.9], [0.62, 0.9], [0.72, 0.64], [0.84, 0.8], [0.93, 0.7], [1, 0.85]];
  for (const [px, py] of peaks) g.lineTo(px * w, hz - (1 - py) * h * 0.55);
  g.lineTo(w, hz); g.closePath(); g.fill();
  g.strokeStyle = '#2fe6ff'; g.lineWidth = Math.max(1, w / 400); g.stroke();
  g.fillStyle = '#0b0018'; g.fillRect(0, hz, w, h - hz);
  if (!withGrid) return;
  g.strokeStyle = '#ff2fb0'; g.lineWidth = Math.max(1, w / 300);
  for (let i = -12; i <= 12; i++) { g.beginPath(); g.moveTo(cx, hz); g.lineTo(cx + i * w * 0.12, h); g.stroke(); }
  for (let i = 0; i < 10; i++) { const k = ((i + t) % 10) / 10, y = hz + (h - hz) * k * k; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
}
const muralT = ctex(1024, 330, (g, w, h) => drawSunset(g, w, h, 0));

// neon sign (redrawn once the script font loads)
const signC = document.createElement('canvas'); signC.width = 1024; signC.height = 256;
const signT = new THREE.CanvasTexture(signC);
function drawSign() {
  const g = signC.getContext('2d'); g.clearRect(0, 0, 1024, 256);
  g.font = '150px "Mr Dafoe", "Brush Script MT", cursive'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.shadowColor = '#ff2fb0'; g.shadowBlur = 30; g.fillStyle = '#ff5fd0'; g.fillText(SIGN_TEXT, 512, 135);
  g.shadowBlur = 0; g.fillStyle = '#ffe3f7'; g.fillText(SIGN_TEXT, 512, 132);
  signT.needsUpdate = true;
}
drawSign();
const redraws = [drawSign];
function makeMarquee(text) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64; const t = new THREE.CanvasTexture(c);
  const draw = () => { const g = c.getContext('2d'); g.fillStyle = '#2a0b3d'; g.fillRect(0, 0, 256, 64);
    g.font = '600 28px "Chakra Petch", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.shadowColor = '#2fe6ff'; g.shadowBlur = 12; g.fillStyle = '#9ff8ff'; g.fillText(text, 128, 34); t.needsUpdate = true; };
  draw(); redraws.push(draw); return t;
}
// neon text sign: a transparent plane with glowing lettering
const blinkers = [];
function neonSign(text, color, w, h, o = {}) {
  const ch = 128, cw = Math.round(ch * w / h), c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const t = new THREE.CanvasTexture(c);
  const draw = () => {
    const g = c.getContext('2d'); g.clearRect(0, 0, cw, ch);
    g.font = `${o.weight || ''} ${Math.round(ch * (o.size || 0.62))}px ${o.font || '"Mr Dafoe", cursive'}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.shadowColor = color; g.shadowBlur = ch * 0.16; g.fillStyle = color; g.fillText(text, cw / 2, ch * 0.55);
    g.shadowBlur = 0; g.globalAlpha = 0.8; g.fillStyle = '#fff4fb'; g.fillText(text, cw / 2, ch * 0.53); g.globalAlpha = 1;
    t.needsUpdate = true;
  };
  draw(); redraws.push(draw);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false, side: o.double ? THREE.DoubleSide : THREE.FrontSide }));
  m.material.color.setScalar(o.boost || 2.2);
  if (o.blink) blinkers.push({ m, mode: o.blink, phase: rnd() * 10 });
  return m;
}
// hand-written paper sign, Filipino-carinderia style
function paperSign(lines, w, h, ink = '#1b1b1b') {
  const ch = 256, cw = Math.round(ch * w / h), c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const t = new THREE.CanvasTexture(c);
  const draw = () => {
    const g = c.getContext('2d'); g.fillStyle = '#f3ecd8'; g.fillRect(0, 0, cw, ch);
    g.fillStyle = 'rgba(120,90,40,.12)'; for (let i = 0; i < 40; i++) g.fillRect(rnd() * cw, rnd() * ch, 2 + rnd() * 14, 2 + rnd() * 6);
    g.fillStyle = 'rgba(230,220,170,.75)'; g.fillRect(cw * 0.04, -6, cw * 0.18, 26); g.fillRect(cw * 0.78, -6, cw * 0.18, 26);
    const n = lines.length, fs = Math.min(ch * 0.8 / n, cw / Math.max(...lines.map(l => l.length)) * 1.55);
    g.font = `${Math.round(fs)}px "Permanent Marker", "Comic Sans MS", cursive`; g.textAlign = 'center'; g.textBaseline = 'middle';
    lines.forEach((l, i) => { g.fillStyle = i === 0 ? ink : '#b3171d'; g.fillText(l, cw / 2, ch * (i + 0.5) / n + ch * 0.03); });
    t.needsUpdate = true;
  };
  draw(); redraws.push(draw);

// ================================================================ Paper Dusk sky (dusk/index.html, run live in p5 instance mode)
// PALETTES copied verbatim from Paper Dusk. Times of day use them in this order: amber dawn → sea glass → dusk plum → violet night.
const PALETTES = [
  { sky: ['#3b2d5e', '#a5697d'], paper: ['#f4e8d8', '#eed2c0', '#e2bfb4'], accent: '#f2c9a0' }, // dusk plum
  { sky: ['#12303f', '#40736d'], paper: ['#e9f2ea', '#d5e7dc', '#bcd8cd'], accent: '#a9e2c9' }, // sea glass
  { sky: ['#42506f', '#d9a86e'], paper: ['#fdf3e0', '#f3ddb8', '#e8c8a0'], accent: '#ffe1a8' }, // amber dawn
  { sky: ['#191430', '#4c2c56'], paper: ['#ece6f7', '#d8cdee', '#c2b3df'], accent: '#b79ff0' }  // violet night
];
const SKY_W = 1024, SKY_H = 320;
const sky = { p: null, tex: null, idx: [0, 0], mix: 0, n: 0 };
const skyFallbackC = document.createElement('canvas'); skyFallbackC.width = 4; skyFallbackC.height = 128;
const skyMat = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(skyFallbackC), side: THREE.BackSide, fog: false, depthWrite: false });
const skyDome = new THREE.Mesh(new THREE.SphereGeometry(90, 48, 16, 0, Math.PI * 2, 0, Math.PI / 2), skyMat); skyDome.renderOrder = -2; scene.add(skyDome);
const skyBelow = new THREE.Mesh(new THREE.SphereGeometry(90, 24, 6, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), new THREE.MeshBasicMaterial({ color: '#000', side: THREE.BackSide, fog: false, depthWrite: false })); skyBelow.renderOrder = -2; scene.add(skyBelow);
function paperDuskSky(p) {
  // Paper Dusk's sky layers as written: the translucent gradient veil and the three cloud layers (sloooow / slow / fast).
  // Changes for the dome: the palette index comes from the world clock, clouds wrap around seamlessly (drawn twice at the seam),
  // there are 18 clouds for the full 360°, speeds are scaled for the dome, and it only draws when the world asks (noLoop + redraw).
  let bg; const clouds = [], cur = {};
  const speedScale = reduce ? 0.5 : 1, DOME_SPEED = 0.3;
  p.setup = () => {
    p.createCanvas(SKY_W, SKY_H); p.pixelDensity(1); p.noLoop();
    bg = p.createGraphics(8, 240); bg.pixelDensity(1);
    for (let i = 0; i < 18; i++) clouds.push(new Cloud(i % 3));
    clouds.sort((a, b) => a.layer - b.layer);
    updatePalette(); renderGradient(); p.image(bg, 0, 0, p.width, p.height);
    sky.tex = new THREE.CanvasTexture(p.drawingContext.canvas); sky.tex.wrapS = THREE.RepeatWrapping;
    skyMat.map = sky.tex; skyMat.needsUpdate = true;
  };
  p.draw = () => {
    updatePalette();
    if (sky.n++ % 20 === 0) renderGradient();
    p.push(); p.tint(255, 26); p.image(bg, 0, 0, p.width, p.height); p.pop();   // translucent veil of sky
    p.noStroke();
    for (const c of clouds) { c.update(); c.display(); }
    sky.tex.needsUpdate = true;
  };
  sky.snap = () => { updatePalette(); renderGradient(); p.image(bg, 0, 0, p.width, p.height); for (const c of clouds) c.display(); sky.tex.needsUpdate = true; };
  function updatePalette() {
    const a = PALETTES[sky.idx[0]], b = PALETTES[sky.idx[1]], mixAmt = sky.mix;
    cur.skyTop = p.lerpColor(p.color(a.sky[0]), p.color(b.sky[0]), mixAmt);
    cur.skyBot = p.lerpColor(p.color(a.sky[1]), p.color(b.sky[1]), mixAmt);
    cur.accent = p.lerpColor(p.color(a.accent), p.color(b.accent), mixAmt);
  }
  function renderGradient() {
    for (let y = 0; y < bg.height; y++) { bg.stroke(p.lerpColor(cur.skyTop, cur.skyBot, y / bg.height)); bg.line(0, y, bg.width, y); }
  }
  class Cloud {
    constructor(layer) {
      this.layer = layer; // 0 far, 1 mid, 2 near
      const m = p.min(p.width, p.height);
      const spec = [
        { spd: [0.04, 0.12], size: [0.08, 0.13], op: [12, 20] },  // sloooow
        { spd: [0.22, 0.45], size: [0.12, 0.19], op: [18, 28] },  // slow
        { spd: [0.85, 1.60], size: [0.18, 0.28], op: [24, 36] }   // fast
      ][layer];
      this.speed = p.random(spec.spd[0], spec.spd[1]) * speedScale * DOME_SPEED;
      this.size = m * p.random(spec.size[0], spec.size[1]);
      this.opacity = p.random(spec.op[0], spec.op[1]);
      this.pos = p.createVector(p.random(p.width), p.random(p.height * 0.85));
      this.bubbles = [];
      const n = p.floor(p.random(3, 7));
      for (let i = 0; i < n; i++) this.bubbles.push({ ox: p.random(-this.size / 2, this.size / 2), oy: p.random(-this.size / 4, this.size / 4), r: p.random(this.size * 0.6, this.size) });
    }
    update() { this.pos.x -= this.speed; if (this.pos.x < -this.size) this.pos.x += p.width; }
    display() {
      // paper-white pulled slightly toward the sky so clouds sit IN it
      const c = p.lerpColor(p.color(255), cur.skyBot, 0.22);
      p.fill(p.red(c), p.green(c), p.blue(c), this.opacity);
      for (const x of [this.pos.x, this.pos.x + p.width, this.pos.x - p.width]) {
        if (x < -this.size * 1.5 || x > p.width + this.size * 1.5) continue;
        p.push(); p.translate(x, this.pos.y);
        for (const b of this.bubbles) p.ellipse(b.ox, b.oy, b.r, b.r * 0.8);
        p.pop();
      }
    }
  }
}
function drawSkyFallback(top, bot) {   // only used if p5 can't load: the same gradient, no clouds

  for (let i = 0; i < d.length; i++) { const v = (Math.random() * 200) | 0; d[i] = 0xff000000 | (v << 16) | (v << 8) | v; }
  g.putImageData(img, 0, 0);
}
function caption(s) { if (captionEl.textContent !== s) captionEl.textContent = s; }
function startPortal(id) {
  if (portalRun.P || mode === 'tour') return;
  const P = PORTALS[id];
  if (mode !== 'walk') player.position.set((P.trig[0] + P.trig[1]) / 2, P.inside.y, (P.trig[2] + P.trig[3]) / 2);   // tapped from the orbit view
  if (mover.flying) setFly(false);
  heading = P.inH; player.rotation.y = heading; player.scale.set(1, 1, 1);

  setMode('portal');
}
function portalStep(dt) {
  const R = portalRun, P = R.P; R.t += dt; const t = R.t;
  camera.position.copy(P.shot[0]); camera.lookAt(P.shot[1]);
  player.position.lerpVectors(R.from, P.inside, ease(clamp01(t / 0.9)));
  let end;

    const B = P.booth; player.visible = t < 0.9;
    B.setCurtain(clamp01((t - 0.9) / 0.6));
    let f = 0, n = 0; for (const k of [1.8, 2.5, 3.2, 3.9]) if (t >= k) { f = Math.max(f, Math.exp(-(t - k) * 9)); n++; }
    B.flash.material.opacity = f * 0.9; flashOv.style.opacity = (reduce ? 0.1 : 0.45) * f;
    caption(t < 1.5 ? '' : t < 4.3 ? '📸 ' + '●'.repeat(n) + '○'.repeat(4 - n) : 'printing…');
    if (t > 4.3) {
      if (!B.strip.visible) { drawStrip(B.stripC); B.stripTex.needsUpdate = true; B.strip.visible = true; }
      const s = Math.max(0.01, ease(clamp01((t - 4.3) / 1.2))); B.strip.scale.y = s; B.strip.position.y = 0.55 - 0.0875 * s;
    }
    if (t > 4.6 && !R.stripShown) { R.stripShown = true; stripOv.querySelector('img').src = B.stripC.toDataURL(); stripOv.classList.add('show'); setTimeout(() => stripOv.classList.remove('show'), 3400); }
    fadeEl.style.opacity = clamp01((t - 5.6) / 0.8);
    end = 6.4;
  } else {
    // the phone rings, you pick up, a short crackly fade
    const ph = P.phone; ph.ready.visible = false;
    const ringing = t > 0.8 && t < 2.6 && ((t - 0.8) % 0.9) < 0.55;
    if (t < 2.6) { ph.handset.position.copy(ph.handsetHome); ph.handset.rotation.z = ringing ? Math.sin(t * 70) * (reduce ? 0.03 : 0.14) : 0; ph.g.position.y += 0; }
    else { const k = ease(clamp01((t - 2.6) / 0.4)); ph.handset.rotation.z = 0; ph.handset.position.set(ph.handsetHome.x - 0.05 * k, ph.handsetHome.y + 0.12 * k, ph.handsetHome.z + 0.1 * k); }
    caption(t < 0.8 ? '' : t < 2.6 ? 'kring… kring…' : t < 3.1 ? 'hello…?' : 'kssshhh…');
    const s = clamp01((t - 3.0) / 1.2);
    if (s > 0) { if (!reduce || !R.staticDrawn) { drawStatic(); R.staticDrawn = true; } staticOv.style.opacity = s * (reduce ? 1 : 0.75 + 0.25 * Math.random()); }
    end = 4.4;

}
function portalArrive() {
  const R = portalRun, P = R.P, D = R.D;
  R.arrived = true; R.t2 = 0;
  if (P.kind === 'photo') { P.booth.setCurtain(0); P.booth.strip.visible = false; P.booth.flash.material.opacity = 0; D.booth.setCurtain(1); flashOv.style.opacity = 0; }
  else { P.phone.handset.position.copy(P.phone.handsetHome); P.phone.handset.rotation.z = 0; }
  player.visible = true; player.position.copy(D.out.p); heading = D.out.h; player.rotation.y = heading; mover.vy = 0; mover.grounded = true;
  for (const k in keys) keys[k] = 0;
  setMode('walk');
  mover.flying = true; walk(1); mover.flying = false; mover.grounded = true;   // one big gravity-free step with no keys held: snaps the follow camera in behind you
  caption(P.kind === 'photo' ? '' : '…');
  fadeEl.style.opacity = P.kind === 'photo' ? 1 : 0;
}
function portalAfter(dt) {   // arrival: fade in from black (photo) or from static (phone); the twin's curtain opens
  const R = portalRun, P = R.P, D = R.D; R.t2 += dt; const k = clamp01(R.t2 / 0.9);
  if (P.kind === 'photo') { fadeEl.style.opacity = 1 - k; D.booth.setCurtain(1 - clamp01(R.t2 / 0.7)); }
  else { if (!reduce) drawStatic(); staticOv.style.opacity = 1 - k; }
  if (k >= 1) { R.P = null; caption(''); staticOv.style.opacity = 0; fadeEl.style.opacity = 0; R.staticDrawn = false; }
}
function portalAt(obj) {   // which portal (if any) does this mesh belong to?
  const roots = [[yardBooth.g, 'yard'], [twinBooth.g, 'twin'], [PHONEBOOTH.g, 'lounge'], [BED.phone.g, 'bedroom']];
  for (let o = obj; o; o = o.parent) for (const [r, id] of roots) if (o === r) return id;
  return null;
}
const portalMeshes = [yardBooth.g, twinBooth.g, PHONEBOOTH.g, BED.phone.g];


// ================================================================ loop
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const clock = new THREE.Clock(); let frameN = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (mode === 'walk') walk(dt);
  else if (mode === 'tour') tourStep(dt);
  else if (mode === 'portal') portalStep(dt);

    if (tween) {

      if (tween.t >= 1) tween = null;
    }
    controls.update();
  }

  const inSpeakBox = q => q.x > SX0 - 0.05 && q.x < SX1 + 0.05 && q.z > SZ0 - 0.05 && q.z < SZ1 && q.y < SH + 0.05;
  shell.visible = mode === 'orbit' ? view !== 'speak' : !inSpeakBox(mode === 'walk' ? player.position : camera.position);
  upstairs.visible = !(mode === 'orbit' && view === 'speak');
  roofTop.visible = mode !== 'orbit' && camera.position.y > 2.0 && Math.abs(camera.position.x) < 4 && camera.position.z < 6 && camera.position.z > SZ0;
  if (portalRun.P && portalRun.arrived) portalAfter(dt);
  updateWorld(dt, t);
  const fairyK = 0.35 + 0.65 * tod.night;   // fairy lights: subtle by day, full at night
  if (!reduce) {
    if (frameN++ % 2 === 0) for (const [c, st, ph] of screens) { drawSunset(c.getContext('2d'), 160, 128, t * 1.6 + ph); st.needsUpdate = true; }
    sign.material.opacity = Math.random() < 0.015 ? 0.35 : 1;
    for (let i = 0; i < fairy.base.length; i++) { const k = (0.55 + 0.45 * Math.sin(t * fairy.speed[i] + fairy.phase[i])) * fairyK; fairy.mesh.setColorAt(i, fairy.tmp.copy(fairy.base[i]).multiplyScalar(k)); }
    fairy.mesh.instanceColor.needsUpdate = true;
    for (let i = 0; i < upFairy.base.length; i++) { const k = (0.55 + 0.45 * Math.sin(t * upFairy.speed[i] + upFairy.phase[i])) * fairyK; upFairy.mesh.setColorAt(i, fairy.tmp.copy(upFairy.base[i]).multiplyScalar(k)); }
    upFairy.mesh.instanceColor.needsUpdate = true;
    for (const b of blinkers) b.m.material.opacity = b.mode === 'blink' ? (Math.sin(t * 4 + b.phase) > -0.3 ? 1 : 0.15) : (Math.random() < 0.02 ? 0.3 : 1);
    coals.color.setHSL(0.06, 1, 0.5 + Math.sin(t * 7) * 0.05 + Math.sin(t * 13) * 0.03).multiplyScalar(2.2);
    for (let i = 0; i < lamps.length; i++) lamps[i].rotation.y = Math.sin(t * 0.4 + i) * 0.25;
  } else {
    if (frameN++ === 0) for (const [c, st] of screens) { drawSunset(c.getContext('2d'), 160, 128, 0); st.needsUpdate = true; }
    if (frameN % 10 === 0) { for (let i = 0; i < fairy.base.length; i++) fairy.mesh.setColorAt(i, fairy.tmp.copy(fairy.base[i]).multiplyScalar(fairyK)); fairy.mesh.instanceColor.needsUpdate = true;
      for (let i = 0; i < upFairy.base.length; i++) upFairy.mesh.setColorAt(i, fairy.tmp.copy(upFairy.base[i]).multiplyScalar(fairyK)); upFairy.mesh.instanceColor.needsUpdate = true; }
  }

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);

setTier(quality.tier); setTod('auto');
