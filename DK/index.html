<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dirty Kitchen v4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&family=Mr+Dafoe&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f6e9ff; --muted:#b9a3cf; --pink:#ff4fd0; --cyan:#3ff0ff; --panel:rgba(18,8,30,.78); --line:rgba(255,79,208,.28);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:inherit}
html,body{height:100%; margin:0}
body{background:#140a24; color:var(--ink); font-family:"Chakra Petch",system-ui,sans-serif; overflow:hidden}
canvas{display:block; position:fixed; inset:0; width:100%; height:100%; touch-action:none; outline:none}
.hud{
  position:fixed; left:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); width:min(290px, calc(100vw - 24px));
  background:var(--panel); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line); border-radius:14px; padding:10px 14px 12px;
}
.head{display:flex; align-items:center; justify-content:space-between}
h1{margin:0; font-family:"Mr Dafoe",cursive; font-weight:400; font-size:38px; line-height:1; color:var(--pink); text-shadow:0 0 8px rgba(255,79,208,.8), 0 0 22px rgba(255,79,208,.45)}
.hint{font-size:12.5px; line-height:1.45; color:var(--muted); margin:6px 0 10px}
.btns{display:flex; gap:6px; flex-wrap:wrap}
button{font:600 12.5px/1 "Chakra Petch",system-ui,sans-serif; padding:8px 12px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer}
button[aria-pressed="true"]{background:var(--pink); color:#1b0626; border-color:var(--pink)}
button:focus-visible{outline:2px solid var(--cyan); outline-offset:2px}
button:disabled{opacity:.35; cursor:default}
.fold{padding:4px 10px; font-size:16px}
.hud.collapsed #hudBody{display:none}
.pad{position:fixed; right:14px; bottom:calc(14px + env(safe-area-inset-bottom,0px)); display:grid; grid-template-columns:repeat(3,54px); grid-template-rows:repeat(2,54px); gap:6px; user-select:none; -webkit-user-select:none}
.pad[hidden]{display:none}
.pad button{width:54px; height:54px; padding:0; font-size:20px; border-radius:12px; background:var(--panel); touch-action:none}
.pad .up{grid-column:2}
.pad .row2{grid-row:2}
.load{position:fixed; inset:0; display:grid; place-items:center; background:#140a24; color:var(--pink); font-family:"Mr Dafoe",cursive; font-size:40px; transition:opacity .8s}
.load.done{opacity:0; pointer-events:none}
@media (prefers-reduced-motion: reduce){ .load{transition:none} }
</style>
</head>
<body>
<div class="load" id="load">lighting the uling…</div>
<div class="hud" id="hud" role="region" aria-label="Scene controls">
  <div class="head">
    <h1>Dirty Kitchen</h1>
    <button class="fold" id="fold" aria-expanded="true" aria-controls="hudBody" aria-label="Hide panel" title="Hide panel (M)">–</button>
  </div>
  <div id="hudBody">
    <p class="hint" id="hint"></p>
    <div class="btns">
      <button id="bWalk" aria-pressed="false">Walk</button>
      <button id="bKitchen">Kitchen</button>
      <button id="bSpeak">Speakeasy</button>
    </div>
  </div>
</div>
<div class="pad" id="pad" hidden>
  <button class="up" data-k="f" aria-label="Forward">▲</button>
  <button class="row2" data-k="l" aria-label="Turn left">◀</button>
  <button class="row2" data-k="b" aria-label="Back">▼</button>
  <button class="row2" data-k="r" aria-label="Turn right">▶</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(() => {
'use strict';
// ================================================================ EDIT ME
const SIGN_TEXT = 'Dirty Kitchen';     // neon sign over the mural
const MARQUEE_TEXT = 'HAT MACHINE';    // arcade cabinet 1
const MARQUEE_TEXT_2 = 'MD WAS RUDE';  // arcade cabinet 2
// Your art, hung in order on the frames (left to right, wall by wall). Images (png/jpg/webp) or videos (mp4/webm).
// Animated GIFs only show their first frame in 3D, so convert them to mp4 for motion. Empty = placeholder cards.
// Hosting on your GitHub Pages works (it allows cross-origin loading). You can also drag files onto the page to preview.
const ART = [
  // 'https://ooakosimo.github.io/cards/card01.mp4',
  // 'https://ooakosimo.github.io/cards/card02.png',
];
const NEON = { pink: '#ff2fb0', cyan: '#2fe6ff', warm: '#ffb766' };

// ================================================================ setup
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.domElement.tabIndex = 0;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#140a24');
scene.fog = new THREE.Fog('#140a24', 10, 24);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.03, 60);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = 1.48; controls.minDistance = 0.6; controls.maxDistance = 12;

let composer = null, bloom = null;
if (THREE.EffectComposer && THREE.UnrealBloomPass && THREE.RenderPass) {
  composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  bloom = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.95, 0.5, 0.85);
  composer.addPass(bloom);
}

// ================================================================ helpers
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const std = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.85, metalness: 0 }, o));
const glow = c => { const m = new THREE.MeshBasicMaterial({ color: c }); m.color.multiplyScalar(2.2); return m; };   // >1 = glows under bloom
function ctex(w, h, draw, rx = 1, ry = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = 4;
  return t;
}
function speckle(g, w, h, n, cols, s = 3) { for (let i = 0; i < n; i++) { g.fillStyle = cols[i % cols.length]; g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * s, 1 + rnd() * s); } }
function boxB(w, h, d, mat, x, y, z, parent = scene) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y + h / 2, z); parent.add(m); return m; }
function cyl(rt, rb, h, mat, x, y, z, seg = 16, parent = scene) { const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat); m.position.set(x, y + h / 2, z); parent.add(m); return m; }
function plane(w, h, mat, x, y, z, ry = 0, parent = scene) { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat); m.position.set(x, y, z); m.rotation.y = ry; parent.add(m); return m; }
const blockers = [];
const block = (x0, x1, z0, z1) => blockers.push([x0, x1, z0, z1]);

// ================================================================ textures
const dirtT = ctex(256, 256, (g, w, h) => { g.fillStyle = '#2a281e'; g.fillRect(0, 0, w, h); speckle(g, w, h, 1400, ['#38361f', '#1c1b14', '#2f3a26', '#433d2a']); }, 7, 7);
const concT = ctex(256, 256, (g, w, h) => { g.fillStyle = '#86827b'; g.fillRect(0, 0, w, h); speckle(g, w, h, 1600, ['#7a766f', '#938f88', '#6d6962'], 2); }, 3, 3);
const blockCanvasDraw = (g, w, h) => {
  g.fillStyle = '#7f7b73'; g.fillRect(0, 0, w, h); speckle(g, w, h, 1500, ['#8e8a82', '#706c65', '#797269'], 2);
  g.strokeStyle = '#5c5851'; g.lineWidth = 5;
  for (let r = 0; r < 4; r++) {
    const y = r * 64; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke();
    for (let x = (r % 2 ? 64 : 0); x <= w; x += 128) { g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 64); g.stroke(); }
  }
};
function blockMat(w, h) { const t = ctex(256, 256, blockCanvasDraw, w / 0.5, h / 0.5); return std('#ffffff', { map: t }); }
const corrT = ctex(128, 128, (g, w, h) => {
  for (let x = 0; x < w; x++) { const v = 120 + Math.sin(x / w * Math.PI * 8) * 40; g.fillStyle = `rgb(${v},${v - 6},${v - 14})`; g.fillRect(x, 0, 1, h); }
  speckle(g, w, h, 160, ['rgba(140,70,30,.55)', 'rgba(90,45,20,.5)'], 6);
}, 6, 1);
const banigT = ctex(256, 256, (g, w, h) => {
  const cols = ['#c9a86a', '#a8322d', '#2f6b4a', '#e2cf9a', '#6b3a7a'];
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    const d = Math.abs(((x + y) % 8) - 4);
    g.fillStyle = (x + y) % 2 ? cols[d % cols.length] : cols[(d + 3) % cols.length];
    g.fillRect(x * 16, y * 16, 16, 16);
    g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(x * 16, y * 16 + ((x % 2) ? 0 : 8), 16, 2);
  }
});
const gridT = ctex(256, 256, (g, w, h) => {
  g.fillStyle = '#0c0417'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#ff2fb0'; g.lineWidth = 5; g.strokeRect(0, 0, w, h);
  g.strokeStyle = 'rgba(47,230,255,.55)'; g.lineWidth = 2; g.beginPath(); g.moveTo(w / 2, 0); g.lineTo(w / 2, h); g.moveTo(0, h / 2); g.lineTo(w, h / 2); g.stroke();
}, 9, 9);
function drawSunset(g, w, h, t = 0, withGrid = true) {
  const hz = h * 0.62;
  const sky = g.createLinearGradient(0, 0, 0, hz); sky.addColorStop(0, '#12052a'); sky.addColorStop(0.55, '#5b1272'); sky.addColorStop(1, '#ff3d8b');
  g.fillStyle = sky; g.fillRect(0, 0, w, hz);
  const r = h * 0.3, cx = w / 2, cy = hz - r * 0.15;
  const sun = g.createLinearGradient(0, cy - r, 0, cy + r); sun.addColorStop(0, '#ffe66b'); sun.addColorStop(1, '#ff2f8f');
  g.save(); g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.clip(); g.fillStyle = sun; g.fillRect(cx - r, cy - r, r * 2, r * 2);
  g.fillStyle = '#6a1477'; for (let i = 0; i < 6; i++) { const y = cy + i * r * 0.17; g.fillRect(cx - r, y, r * 2, 1 + i * r * 0.025); }
  g.restore();
  g.fillStyle = '#1a0630'; g.beginPath(); g.moveTo(0, hz);
  const peaks = [[0.08, 0.72], [0.17, 0.82], [0.27, 0.66], [0.38, 0.9], [0.62, 0.9], [0.72, 0.64], [0.84, 0.8], [0.93, 0.7], [1, 0.85]];
  for (const [px, py] of peaks) g.lineTo(px * w, hz - (1 - py) * h * 0.55);
  g.lineTo(w, hz); g.closePath(); g.fill();
  g.strokeStyle = '#2fe6ff'; g.lineWidth = Math.max(1, w / 400); g.stroke();
  g.fillStyle = '#0b0018'; g.fillRect(0, hz, w, h - hz);
  if (!withGrid) return;
  g.strokeStyle = '#ff2fb0'; g.lineWidth = Math.max(1, w / 300);
  for (let i = -12; i <= 12; i++) { g.beginPath(); g.moveTo(cx, hz); g.lineTo(cx + i * w * 0.12, h); g.stroke(); }
  for (let i = 0; i < 10; i++) { const k = ((i + t) % 10) / 10, y = hz + (h - hz) * k * k; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
}
const muralT = ctex(1024, 330, (g, w, h) => drawSunset(g, w, h, 0));

// neon sign (redrawn once the script font loads)
const signC = document.createElement('canvas'); signC.width = 1024; signC.height = 256;
const signT = new THREE.CanvasTexture(signC);
function drawSign() {
  const g = signC.getContext('2d'); g.clearRect(0, 0, 1024, 256);
  g.font = '150px "Mr Dafoe", "Brush Script MT", cursive'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.shadowColor = '#ff2fb0'; g.shadowBlur = 30; g.fillStyle = '#ff5fd0'; g.fillText(SIGN_TEXT, 512, 135);
  g.shadowBlur = 0; g.fillStyle = '#ffe3f7'; g.fillText(SIGN_TEXT, 512, 132);
  signT.needsUpdate = true;
}
drawSign();
const redraws = [drawSign];
function makeMarquee(text) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64; const t = new THREE.CanvasTexture(c);
  const draw = () => { const g = c.getContext('2d'); g.fillStyle = '#2a0b3d'; g.fillRect(0, 0, 256, 64);
    g.font = '600 28px "Chakra Petch", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.shadowColor = '#2fe6ff'; g.shadowBlur = 12; g.fillStyle = '#9ff8ff'; g.fillText(text, 128, 34); t.needsUpdate = true; };
  draw(); redraws.push(draw); return t;
}
// neon text sign: a transparent plane with glowing lettering
const blinkers = [];
function neonSign(text, color, w, h, o = {}) {
  const ch = 128, cw = Math.round(ch * w / h), c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const t = new THREE.CanvasTexture(c);
  const draw = () => {
    const g = c.getContext('2d'); g.clearRect(0, 0, cw, ch);
    g.font = `${o.weight || ''} ${Math.round(ch * (o.size || 0.62))}px ${o.font || '"Mr Dafoe", cursive'}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.shadowColor = color; g.shadowBlur = ch * 0.16; g.fillStyle = color; g.fillText(text, cw / 2, ch * 0.55);
    g.shadowBlur = 0; g.globalAlpha = 0.8; g.fillStyle = '#fff4fb'; g.fillText(text, cw / 2, ch * 0.53); g.globalAlpha = 1;
    t.needsUpdate = true;
  };
  draw(); redraws.push(draw);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false, side: o.double ? THREE.DoubleSide : THREE.FrontSide }));
  m.material.color.setScalar(o.boost || 2.2);
  if (o.blink) blinkers.push({ m, mode: o.blink, phase: rnd() * 10 });
  return m;
}
// hand-written paper sign, Filipino-carinderia style
function paperSign(lines, w, h, ink = '#1b1b1b') {
  const ch = 256, cw = Math.round(ch * w / h), c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const t = new THREE.CanvasTexture(c);
  const draw = () => {
    const g = c.getContext('2d'); g.fillStyle = '#f3ecd8'; g.fillRect(0, 0, cw, ch);
    g.fillStyle = 'rgba(120,90,40,.12)'; for (let i = 0; i < 40; i++) g.fillRect(rnd() * cw, rnd() * ch, 2 + rnd() * 14, 2 + rnd() * 6);
    g.fillStyle = 'rgba(230,220,170,.75)'; g.fillRect(cw * 0.04, -6, cw * 0.18, 26); g.fillRect(cw * 0.78, -6, cw * 0.18, 26);
    const n = lines.length, fs = Math.min(ch * 0.8 / n, cw / Math.max(...lines.map(l => l.length)) * 1.55);
    g.font = `${Math.round(fs)}px "Permanent Marker", "Comic Sans MS", cursive`; g.textAlign = 'center'; g.textBaseline = 'middle';
    lines.forEach((l, i) => { g.fillStyle = i === 0 ? ink : '#b3171d'; g.fillText(l, cw / 2, ch * (i + 0.5) / n + ch * 0.03); });
    t.needsUpdate = true;
  };
  draw(); redraws.push(draw);
  return new THREE.Mesh(new THREE.PlaneGeometry(w, h), std('#ffffff', { map: t, roughness: 0.9 }));
}

// ================================================================ lights
scene.add(new THREE.HemisphereLight('#6b5a9e', '#1a1408', 0.5));
const moon = new THREE.DirectionalLight('#8aa0ff', 0.35); moon.position.set(-3, 5, 4); scene.add(moon);

// ================================================================ yard
const yard = new THREE.Mesh(new THREE.PlaneGeometry(16, 16), std('#ffffff', { map: dirtT }));
yard.rotation.x = -Math.PI / 2; yard.position.set(0, -0.003, 1); scene.add(yard);
const terra = std('#a2502e'), leafM = std('#2f6b35', { side: THREE.DoubleSide }), leafD = std('#24552b', { side: THREE.DoubleSide });
function potted(x, z, s = 1) {
  cyl(0.11 * s, 0.08 * s, 0.16 * s, terra, x, 0, z);
  for (let i = 0; i < 5; i++) { const m = new THREE.Mesh(new THREE.IcosahedronGeometry(0.09 * s, 0), i % 2 ? leafM : leafD); m.position.set(x + (rnd() - .5) * .14 * s, 0.22 * s + rnd() * .14 * s, z + (rnd() - .5) * .14 * s); scene.add(m); }
  block(x - 0.12 * s, x + 0.12 * s, z - 0.12 * s, z + 0.12 * s);
}
function banana(x, z) {
  cyl(0.05, 0.07, 1.1, std('#5d6b3a'), x, 0, z);
  for (let i = 0; i < 6; i++) {
    const piv = new THREE.Group(); piv.position.set(x, 1.08, z); piv.rotation.y = i / 6 * Math.PI * 2 + rnd() * 0.4; scene.add(piv);
    const l = new THREE.Mesh(new THREE.PlaneGeometry(0.22, 0.8), i % 2 ? leafM : leafD);
    l.position.set(0, 0.2, 0.32); l.rotation.x = -0.9 - rnd() * 0.4; piv.add(l);
  }
  block(x - 0.08, x + 0.08, z - 0.08, z + 0.08);
}
potted(2.55, 3.7); potted(-2.6, 3.4, 1.2); potted(2.5, 0.7, 0.9); banana(-3.3, 1.2); banana(3.4, 2.4);

// ================================================================ dirty kitchen  (x -2..2, z 0..4, open front) — messy balcony-pantry energy
const KD = 4.0;
const KF = new THREE.Mesh(new THREE.PlaneGeometry(4, KD + 0.1), std('#ffffff', { map: concT }));
KF.rotation.x = -Math.PI / 2; KF.position.set(0, 0.001, KD / 2); scene.add(KF);
// back wall with a fridge-sized gap at x 0.8..1.4
const FX = 1.1, FW = 0.6, FD = 0.36, FH = 0.95;
boxB(2.8, 1.7, 0.1, blockMat(2.8, 1.7), -0.6, 0, 0);
boxB(0.6, 1.7, 0.1, blockMat(0.6, 1.7), 1.7, 0, 0);
boxB(0.6, 0.75, 0.1, blockMat(0.6, 0.75), FX, FH, 0);
block(-2, FX - FW / 2, -0.06, 0.06); block(FX + FW / 2, 2, -0.06, 0.06);
for (const sx of [-1, 1]) {
  boxB(0.1, 0.6, KD, blockMat(KD, 0.6), sx * 2, 0, KD / 2); block(sx * 2 - 0.06, sx * 2 + 0.06, 0, KD + 0.05);
  boxB(0.08, 1.64, 0.08, std('#5a4330'), sx * 2, 0, KD);
}
// corrugated roof with tinted polycarbonate strips (seen from below only = cutaway from above)
{
  const dz = KD + 0.45, dy = 0.35, len = Math.hypot(dz, dy);
  const roof = new THREE.Group(); roof.rotation.x = -Math.PI / 2 + Math.atan2(dy, dz); roof.position.set(0, 1.95 - dy / 2, -0.05 + dz / 2); scene.add(roof);
  roof.add(new THREE.Mesh(new THREE.PlaneGeometry(4.5, len), std('#ffffff', { map: corrT, side: THREE.BackSide, roughness: 0.6, metalness: 0.3 })));
  [['#2f6bff', -1.4], ['#ffd23f', -0.2], ['#22b573', 0.9], ['#2f6bff', 1.8]].forEach(([c, x]) => {
    const p = new THREE.Mesh(new THREE.PlaneGeometry(0.45, len - 0.1), std(c, { side: THREE.BackSide, transparent: true, opacity: 0.6, emissive: c, emissiveIntensity: 0.35 }));
    p.position.set(x, 0, -0.008); roof.add(p);
  });
}
// ---- little prop helpers
const conc = std('#ffffff', { map: concT });
const black = std('#1b1b1d', { roughness: 0.5, metalness: 0.3 }), steel = std('#b9bec4', { metalness: 0.8, roughness: 0.3 }), darkPan = std('#232325', { metalness: 0.5, roughness: 0.45 });
const glassM = std('#dff4ff', { transparent: true, opacity: 0.35, roughness: 0.05 });
const woodGrainT = ctex(256, 128, (g, w, h) => { g.fillStyle = '#9a7650'; g.fillRect(0, 0, w, h); for (let i = 0; i < 40; i++) { g.strokeStyle = `rgba(${60 + rnd() * 40},${40 + rnd() * 30},20,${0.25 + rnd() * 0.3})`; g.lineWidth = 1 + rnd() * 3; g.beginPath(); const y = rnd() * h; g.moveTo(0, y); g.bezierCurveTo(w * 0.3, y + (rnd() - .5) * 20, w * 0.7, y + (rnd() - .5) * 20, w, y + (rnd() - .5) * 10); g.stroke(); } });
function foldTable(x, z, w, d, topMat) {

// a bartender who has been waiting all night
function capsuleMesh(color) {

  for (let i = 0; i <= 10; i++) { const a = i / 10 * Math.PI / 2; pts.push(new THREE.Vector2(Math.cos(a) * r, h + Math.sin(a) * r)); }
  const g = new THREE.Group();
  const b = new THREE.Mesh(new THREE.LatheGeometry(pts, 28), std(color, { roughness: 0.4 })); b.position.y = 0.4; g.add(b);
  const n = new THREE.Mesh(new THREE.SphereGeometry(0.022, 10, 8), std('#ffffff', { roughness: 0.3 })); n.position.set(0, 0.6, 0.2); g.add(n);

}

{

  plane(SD + 0.12, 1.9, sideM, SX0 - 0.05, 0.95, SCZ - 0.02, -Math.PI / 2, shell);

// ================================================================ modes, views, UI
const $ = id => document.getElementById(id);

  kitchen: [new THREE.Vector3(3.1, 2.6, 6.6), new THREE.Vector3(0, 0.4, 1.7)],

}

const keys = { f: 0, b: 0, l: 0, r: 0 };

  const k = b.dataset.k;

// tap the fridge in orbit mode
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });

// ================================================================ hanging art
function cover(t, iw, ih, fw, fh) {
  t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping; t.repeat.set(1, 1); t.offset.set(0, 0);
  const ar = iw / ih, fr = fw / fh;
  if (ar > fr) { t.repeat.x = fr / ar; t.offset.x = (1 - t.repeat.x) / 2; } else { t.repeat.y = ar / fr; t.offset.y = (1 - t.repeat.y) / 2; }
  t.needsUpdate = true;
}
function swapMap(fr, t) { const old = fr.mat.map; fr.mat.map = t; fr.mat.needsUpdate = true; if (old && old !== t) old.dispose(); }
function setArt(fr, url, isVideo) {
  if (fr.video) { fr.video.pause(); fr.video.removeAttribute('src'); fr.video = null; }
  fr.custom = true;
  if (isVideo) {
    const v = document.createElement('video');
    v.crossOrigin = 'anonymous'; v.loop = true; v.muted = true; v.playsInline = true; v.setAttribute('playsinline', ''); v.src = url;
    v.addEventListener('loadedmetadata', () => { const t = new THREE.VideoTexture(v); cover(t, v.videoWidth, v.videoHeight, fr.w, fr.h); swapMap(fr, t); }, { once: true });
    v.play().catch(() => {}); fr.video = v;
  } else {
    const L = new THREE.TextureLoader(); L.setCrossOrigin('anonymous');
    L.load(url, t => { cover(t, t.image.width, t.image.height, fr.w, fr.h); swapMap(fr, t); }, undefined, () => { fr.custom = false; });
  }
}
const isVid = s => /\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(s);
ART.forEach((u, i) => { if (frames[i]) setArt(frames[i], u, isVid(u)); });
const picker = document.createElement('input'); picker.type = 'file'; picker.accept = 'image/*,video/*'; picker.multiple = true; picker.hidden = true; document.body.appendChild(picker);
let pickStart = 0;

picker.addEventListener('change', () => { hangFiles([...picker.files], pickStart); picker.value = ''; });

});

// ================================================================ walking + collision
function collide(x, z) {
  const r = 0.2, list = doorAngle > -0.7 ? blockers.concat([doorBlock]) : blockers;
  for (let it = 0; it < 3; it++) for (const b of list) {
    const cx = Math.max(b[0], Math.min(x, b[1])), cz = Math.max(b[2], Math.min(z, b[3]));
    const dx = x - cx, dz = z - cz, d2 = dx * dx + dz * dz;
    if (d2 >= r * r) continue;
    if (d2 > 1e-9) { const d = Math.sqrt(d2); x = cx + dx / d * r; z = cz + dz / d * r; }
    else {
      const pen = [[x - b[0] + r, -1, 0], [b[1] - x + r, 1, 0], [z - b[2] + r, 0, -1], [b[3] - z + r, 0, 1]].sort((p, q) => p[0] - q[0])[0];
      x += pen[1] * pen[0]; z += pen[2] * pen[0];
    }
  }
  return [Math.max(-6.5, Math.min(6.5, x)), Math.max(SZ0, Math.min(8, z))];
}
const camLook = new THREE.Vector3(); const desired = new THREE.Vector3();
function walk(dt) {
  heading += (keys.l - keys.r) * 2.3 * dt;
  const v = (keys.f - keys.b) * 1.4;
  const [x, z] = collide(player.position.x + Math.sin(heading) * v * dt, player.position.z + Math.cos(heading) * v * dt);
  player.position.x = x; player.position.z = z; player.rotation.y = heading;
  const fx = Math.sin(heading), fz = Math.cos(heading), inSpeak = z < SZ1;
  desired.set(x - fx * 1.45, 1.05, z - fz * 1.45);
  if (inSpeak) {
    desired.x = Math.max(SX0 + 0.12, Math.min(SX1 - 0.12, desired.x));
    desired.z = Math.max(SZ0 + 0.12, Math.min(SZ1 - 0.12, desired.z));
  } else if (x > -2 && x < 2 && z < KD + 0.1) desired.z = Math.max(0.2, desired.z);
  const k = 1 - Math.exp(-dt * 6);
  camera.position.lerp(desired, k);
  camLook.lerp(new THREE.Vector3(x + fx * 0.5, 0.45, z + fz * 0.5), k);
  camera.lookAt(camLook);
  doorTarget = Math.hypot(x - FX, z - 0.15) < 1.0 ? -1.9 : 0;
}

// ================================================================ loop
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const clock = new THREE.Clock(); let frameN = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (mode === 'walk') walk(dt);
  else {
    if (tween) {
      tween.t = Math.min(1, tween.t + dt / 1.1); const k = ease(tween.t);

      if (tween.t >= 1) tween = null;

  shell.visible = mode === 'orbit' ? view !== 'speak' : player.position.z >= SZ1;

    coals.color.setHSL(0.06, 1, 0.5 + Math.sin(t * 7) * 0.05 + Math.sin(t * 13) * 0.03).multiplyScalar(2.2);
    for (let i = 0; i < lamps.length; i++) lamps[i].rotation.y = Math.sin(t * 0.4 + i) * 0.25;
  } else if (frameN++ === 0) for (const [c, st] of screens) { drawSunset(c.getContext('2d'), 160, 128, 0); st.needsUpdate = true; }
  if (composer) composer.render(); else renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
  if (composer) { composer.setSize(innerWidth, innerHeight); bloom.setSize(innerWidth, innerHeight); }
