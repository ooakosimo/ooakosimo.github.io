<style>
:root{--paper:#d8ceb8;--ink:#15130f;--cream:#eee6d5;--red:#8f2f2a;--panel:#171512ee}
*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:var(--paper);font-family:"Courier New",monospace;touch-action:manipulation}canvas{display:block}
#start{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:13px;padding:24px;text-align:center;background:radial-gradient(circle at 50% 42%,#e7ddc9 0,#c9bea8 48%,#9e9381 100%);color:var(--ink)}
#start h1{max-width:900px;margin:0;font-size:clamp(34px,9vw,86px);line-height:.82;letter-spacing:-3px}.tag{padding:6px 9px;background:var(--ink);color:var(--cream);font-size:11px;letter-spacing:2px}.sources{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}.src,#deck button,#panel button,#deckToggle{min-height:44px;border:2px solid var(--ink);background:var(--cream);color:var(--ink);box-shadow:4px 4px var(--ink);font:900 12px "Courier New";cursor:pointer}.src{min-width:220px;padding:12px 16px}.src:active,#deck button:active,#panel button:active,.hot{transform:translate(2px,2px);box-shadow:1px 1px var(--ink)!important;background:var(--ink)!important;color:var(--cream)!important}.hint{max-width:760px;font-size:10px;line-height:1.45;background:#eee6d5cc;padding:5px 7px}
#hud{position:fixed;left:10px;top:9px;z-index:15;white-space:pre;pointer-events:none;font-size:10px;line-height:1.35;padding:5px 7px;background:#171512c9;color:#eee6d5}
#deckToggle{position:fixed;right:10px;bottom:10px;z-index:42;display:none;min-height:38px;padding:6px 9px;background:#eee6d5dd;backdrop-filter:blur(3px)}
#deck{position:fixed;left:8px;right:8px;bottom:58px;z-index:40;display:none;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:8px;background:#1715129c;border:1px dashed #eee6d588;backdrop-filter:blur(5px)}
#deck button{min-width:0;padding:7px 4px;background:#eee6d5e8;backdrop-filter:blur(3px)}
#panel{position:fixed;right:0;top:0;z-index:45;display:none;width:min(390px,94vw);height:100vh;overflow-y:auto;padding:12px;background:var(--panel);color:var(--cream);border-left:2px solid var(--red);font-size:11px}.slot{padding:8px;margin:8px 0;border:1px dashed #7c7468}.slot h3{margin:0 0 7px;color:#ff796c}.row{display:flex;align-items:center;gap:7px;margin:6px 0}.row label{width:82px;color:#bbb}.row input[type=range],.row select{flex:1;min-width:0}.row select{background:#27231e;color:var(--cream);border:1px solid #777}.value{width:42px;text-align:right}.mini{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
@media(max-width:760px){#deck{grid-template-columns:repeat(4,minmax(0,1fr));max-height:46vh;overflow:auto}.deck button{font-size:10px;min-height:40px}#hud{font-size:8px}#start h1{letter-spacing:-2px}}
</style>

<body>
<div id="start">
 <div class="tag">OOAKOSIMO // HAND DRAWING → VJ INSTRUMENT</div>
 <h1>LOVE<br>STATIC</h1>
 <div class="sources">
  <button id="micStart" class="src">◉ MIC / BLACKHOLE</button>
  <button id="track1Start" class="src">♪ LOVE STATIC</button>
  <button id="track2Start" class="src">♪ HEARTBREAK HOTEL ON MARS</button>
  <button id="autoStart" class="src">∞ DISPLAY / AUTO</button>
 </div>
 <div class="hint">Touch / keyboard / remote VJ instrument. Warm paper by default — no painful pure white. Demo music buttons expect the two MP3 files beside this HTML.</div>
</div>
<div id="hud"></div>
<button id="deckToggle">☰ DECK</button>
<div id="deck" class="deck">
 <button data-trigger="shock">Q LOVE SHOCK</button><button data-trigger="storm">W LIGHTNING</button><button data-trigger="hearts">E HEARTS</button><button data-trigger="ripple">R RIPPLE</button>
 <button data-trigger="stretch">Y STRETCH</button><button data-trigger="wiggle">U WIGGLE</button><button data-trigger="invert">T INVERT</button><button id="paletteBtn">P PALETTE</button>
 <button id="autoBtn">A AUTO</button><button id="freezeBtn">SPACE FREEZE</button><button id="hudBtn">0 HUD</button><button id="panelBtn">S MODS</button>
 <button id="sensDown">− SENS</button><button id="sensUp">+ SENS</button><button id="trackBtn">M MUSIC</button><button id="fullBtn">F FULL</button><button data-trigger="reset">RESET</button>
</div>
<div id="panel"></div>
<script>
let AUDIO_SOURCE='auto',started=false,fft,micStream,micSrc,micGainNode,song=null,currentTrack=0;
const TRACKS=['LoveStatic-Ooakosimo.mp3','Heartbreak-Hotel-on-Mars.mp3'];
let SENSITIVITY=1.15,MIC_GAIN=1.6,NORMALIZE=true,FROZEN=false,SHOW_HUD=true,SHOW_PANEL=false,SHOW_DECK=false,AUTO_CRUISE=true,DENSITY=2;
const BANDS=['sub','bass','lowMid','mid','high','air'],HZ={sub:[20,60],bass:[60,140],lowMid:[140,400],mid:[400,1600],high:[1600,5000],air:[5000,14000]};
const raw={sub:0,bass:0,lowMid:0,mid:0,high:0,air:0},nrm={...raw},peak={sub:8,bass:8,lowMid:8,mid:8,high:8,air:8};
let staticEnergy=0,shock=0,storm=0,heartBurst=0,invertFlash=0,roomPulse=0,stretchHit=0,wiggleHit=0,lastAuto=0,lastControl=0;
let hairs=[],hearts=[],scratches=[],ripples=[],leftWallSeeds=[];let paletteIndex=0;
const PALETTES=[
{name:'PAPER',bg:[214,204,183],room:[178,166,145],ink:[22,20,16],accent:[126,46,40]},
{name:'NOIR',bg:[22,21,20],room:[54,50,46],ink:[235,226,207],accent:[168,70,63]},
{name:'BLOOD',bg:[57,25,24],room:[92,42,38],ink:[235,222,199],accent:[191,54,45]},
{name:'XEROX',bg:[207,198,177],room:[150,142,128],ink:[4,4,4],accent:[90,25,22]}
];
class Mod{constructor(name,band,min,max,curve=.8,attack=.55,release=.08){Object.assign(this,{name,band,min,max,curve,attack,release});this.s=0;this.value=min}update(){let x=pow(constrain(nrm[this.band],0,1),this.curve),k=x>this.s?this.attack:this.release;this.s+=(x-this.s)*k;this.value=this.min+this.s*(this.max-this.min);return this.value}}
const MODS={
heartPulse:new Mod('heart pulse','sub',1,2.15,.58,.82,.07),
beardStretch:new Mod('beard stretch','bass',1,2.55,.63,.75,.06),
beardPush:new Mod('beard push','lowMid',0,92,.7,.7,.055),
hairWrithe:new Mod('hair writhe','lowMid',5,42,.72,.62,.06),
faceJitter:new Mod('face jitter','mid',0,13,.82,.62,.11),
lightning:new Mod('lightning density','high',.1,1.35,.65,.8,.08),
scratches:new Mod('ink debris','air',.02,.65,.72,.78,.11),
roomBreath:new Mod('room breath','sub',0,28,.7,.58,.055),
globalStatic:new Mod('global static','mid',2,28,.73,.6,.07)
};
function setup(){createCanvas(windowWidth,windowHeight);pixelDensity(min(window.devicePixelRatio||1,1.5));fft=new p5.FFT(.78,1024);for(let i=0;i<90;i++)leftWallSeeds.push(random(9999));buildScene();bindUI();buildPanel();connectMQTT()}
function bindUI(){
 micStart.onclick=startMic;track1Start.onclick=()=>startTrack(0);track2Start.onclick=()=>startTrack(1);autoStart.onclick=startAuto;
 document.querySelectorAll('[data-trigger]').forEach(b=>b.onclick=e=>{e.stopPropagation();trigger(b.dataset.trigger)});
 deckToggle.onclick=toggleDeck;paletteBtn.onclick=cyclePalette;autoBtn.onclick=toggleAuto;freezeBtn.onclick=toggleFreeze;hudBtn.onclick=()=>SHOW_HUD=!SHOW_HUD;panelBtn.onclick=togglePanel;sensDown.onclick=()=>SENSITIVITY=max(.2,SENSITIVITY-.1);sensUp.onclick=()=>SENSITIVITY=min(3,SENSITIVITY+.1);trackBtn.onclick=nextTrack;fullBtn.onclick=()=>fullscreen(!fullscreen());
}
function launch(){started=true;start.style.display='none';deckToggle.style.display='block';SHOW_DECK=false;deck.style.display='none'}
function startAuto(){AUDIO_SOURCE='auto';AUTO_CRUISE=true;stopSong();launch()}
async function startMic(){try{stopSong();AUDIO_SOURCE='mic';await userStartAudio();micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});let ac=getAudioContext();micSrc=ac.createMediaStreamSource(micStream);micGainNode=ac.createGain();micGainNode.gain.value=MIC_GAIN;micSrc.connect(micGainNode);fft.setInput(micGainNode);launch()}catch(e){document.querySelector('#start .hint').textContent='MIC FAILED — use HTTPS and allow microphone permission.'}}
function stopSong(){if(song){try{song.stop()}catch(e){}song=null}}
function startTrack(i){stopSong();AUDIO_SOURCE='music';currentTrack=i;userStartAudio();song=loadSound(TRACKS[i],()=>{song.loop();fft.setInput(song);launch()},()=>{document.querySelector('#start .hint').textContent='DEMO MP3 NOT FOUND YET — upload '+TRACKS[i]+' into /lovestatic/ beside index.html.'})}
function nextTrack(){if(AUDIO_SOURCE!=='music'){startTrack(currentTrack);return}currentTrack=(currentTrack+1)%TRACKS.length;startTrack(currentTrack)}
function toggleDeck(){SHOW_DECK=!SHOW_DECK;deck.style.display=SHOW_DECK?'grid':'none';deckToggle.textContent=SHOW_DECK?'× HIDE':'☰ DECK'}
function adapt(v,p){let next=max(v,p*.99935);return next<6?[0,next]:[constrain(v/next,0,1),next]}
function readAudio(){
 if(AUDIO_SOURCE==='auto'&&started){let t=millis()*.001,beat=pow(max(0,sin(t*2.35)),12),half=pow(max(0,sin(t*1.17+.4)),8),slow=sin(t*.29)*.5+.5;nrm.sub=.14+.68*half;nrm.bass=.08+.9*beat;nrm.lowMid=.12+.72*noise(t*.26+10);nrm.mid=.1+.72*(sin(t*.77+1.6)*.5+.5);nrm.high=.05+.86*pow(max(0,sin(t*1.43+2)),5);nrm.air=.04+.75*noise(t*.82+80)*(.35+.65*slow);for(let b of BANDS){nrm[b]=constrain(nrm[b]*SENSITIVITY,0,1);raw[b]=nrm[b]*190}return}
 if(started&&fft){fft.analyze();for(let b of BANDS){raw[b]=fft.getEnergy(HZ[b][0],HZ[b][1]);let v;if(NORMALIZE)[v,peak[b]]=adapt(raw[b],peak[b]);else v=raw[b]/255;nrm[b]=constrain(v*SENSITIVITY,0,1)}}
}
function buildScene(){hairs=[];hearts=[];scratches=[];let mul=DENSITY===1?.65:DENSITY===3?1.4:1;for(let i=0;i<floor(205*mul);i++){let side=i<50, bx=side?(random()<.5?-1:1)*random(92,154):randomGaussian(0,92),by=side?random(-5,105):random(78,265),len=side?random(35,95):random(30,105);let tx=bx+(side?Math.sign(bx)*random(25,70):random(-34,34)),ty=by+(side?random(-12,35):len);hairs.push({bx,by,tx,ty,vx:0,vy:0,len,seed:random(9999),side})}hearts=[[-232,-160,44],[235,-150,55],[-245,36,32],[246,45,43],[-250,170,55],[250,178,49],[210,258,36]];for(let i=0;i<floor(170*mul);i++)scratches.push({a:random(TWO_PI),r:random(170,305),len:random(7,62),ang:random(TWO_PI),w:random(.4,2.4),seed:random(9999)})}
function draw(){readAudio();Object.values(MODS).forEach(m=>m.update());runAuto();let pal=PALETTES[paletteIndex];background(...pal.bg);drawRoom(pal);if(started){push();translate(width*.5,height*.48);let s=min(width/700,height/920)*1.45;scale(s);drawStaticField(pal);drawCharacter(pal);pop();drawRipples(pal)}drawHUD();shock*=.9;storm*=.91;heartBurst*=.89;invertFlash=max(0,invertFlash-1);roomPulse*=.92;stretchHit*=.88;wiggleHit*=.89;staticEnergy=lerp(staticEnergy,MODS.globalStatic.value,.08)}
function drawRoom(pal){let breath=MODS.roomBreath.value+roomPulse;stroke(...pal.ink,135);strokeWeight(1.25);noFill();let pBL=createVector(width*.15,height*.85),pBR=createVector(width*.9,height*.7),pFL=createVector(0,height),pFR=createVector(width,height),pTL=createVector(width*.15,height*.1),pTR=createVector(width*.9,height*.1);quad(pFL.x,pFL.y,pFR.x,pFR.y,pBR.x,pBR.y,pBL.x,pBL.y);quad(pBL.x,pBL.y,pBR.x,pBR.y,pTR.x,pTR.y,pTL.x,pTL.y);quad(0,0,pTL.x,pTL.y,pBL.x,pBL.y,pFL.x,pFL.y);
 // restored stop-motion left wall: tall stitched padded strips + jittered seam lines
 for(let j=0;j<10;j++){let t0=j/10,t1=(j+1)/10;let yL0=lerp(0,height,t0),yL1=lerp(0,height,t1),xR0=lerp(width*.35,pTL.x,t0),xR1=lerp(width*.35,pBL.x,t1);drawPad(0,yL0,xR0,lerp(0,pTL.y,t0),xR1,lerp(0,pBL.y,t1),0,yL1,pal,breath*.42);for(let k=0;k<6;k++){let u=k/6,xx=lerp(xR0,pTL.x,u),yy=lerp(lerp(0,pTL.y,t0),lerp(pTL.y,pBL.y,t0),u);stroke(...pal.ink,70);line(xx+sin(frameCount*.18+leftWallSeeds[(j*6+k)%leftWallSeeds.length])*2,yy,xx+random(-2,2),lerp(lerp(0,pBL.y,t1),lerp(pTL.y,pBL.y,t1),u))}}
 for(let i=0;i<4;i++)for(let j=0;j<4;j++){let x1=lerp(pTL.x,pTR.x,i/4),x2=lerp(pTL.x,pTR.x,(i+1)/4),y1=lerp(pTL.y,pBL.y,j/4),y2=lerp(pTL.y,pBL.y,(j+1)/4);drawPad(x1,y1,x2,y1,x2,y2,x1,y2,pal,breath*.28)}
 for(let j=0;j<5;j++)for(let i=0;i<5;i++){let tlx=lerp(pBL.x,pFL.x,j/5),tly=lerp(pBL.y,pFL.y,j/5),trx=lerp(pBR.x,pFR.x,j/5),tryy=lerp(pBR.y,pFR.y,j/5),blx=lerp(pBL.x,pFL.x,(j+1)/5),bly=lerp(pBL.y,pFL.y,(j+1)/5),brx=lerp(pBR.x,pFR.x,(j+1)/5),bry=lerp(pBR.y,pFR.y,(j+1)/5);drawPad(lerp(tlx,trx,i/5),lerp(tly,tryy,i/5),lerp(tlx,trx,(i+1)/5),lerp(tly,tryy,(i+1)/5),lerp(blx,brx,(i+1)/5),lerp(bly,bry,(i+1)/5),lerp(blx,brx,i/5),lerp(bly,bry,i/5),pal,breath*.18)}}
function drawPad(x1,y1,x2,y2,x3,y3,x4,y4,pal,pulse){stroke(...pal.ink,105);noFill();quad(x1,y1,x2,y2,x3,y3,x4,y4);let cx=(x1+x2+x3+x4)/4,cy=(y1+y2+y3+y4)/4,r=4+pulse;beginShape();for(let a=0;a<TWO_PI;a+=PI/6)vertex(cx+cos(a)*(r+random(-1.2,1.2)),cy+sin(a)*(r*.7+random(-.8,.8)));endShape(CLOSE);stroke(...pal.ink,65);line(cx,cy,(x1+x2)/2+random(-2,2),(y1+y2)/2);line(cx,cy,(x2+x3)/2,(y2+y3)/2+random(-2,2));line(cx,cy,(x3+x4)/2+random(-2,2),(y3+y4)/2);line(cx,cy,(x4+x1)/2,(y4+y1)/2+random(-2,2))}
function drawStaticField(pal){for(let s of scratches){if(random()>MODS.scratches.value+.32)continue;let x=cos(s.a)*s.r,y=sin(s.a)*s.r*1.12,j=sin(frameCount*.07+s.seed)*staticEnergy*.08;stroke(...pal.ink,100+120*nrm.air);strokeWeight(s.w);line(x+j,y,x+cos(s.ang)*s.len-j,y+sin(s.ang)*s.len)}if(random()<MODS.lightning.value*.62+storm*.07){for(let k=0;k<floor(2+MODS.lightning.value*8+storm);k++)bolt(random()<.5?-1:1,pal)}}
function bolt(side,pal){let x=side*random(165,230),y=random(-200,190),ex=side*random(265,330),ey=y+random(-105,105),lx=x,ly=y;stroke(...(invertFlash?pal.bg:pal.ink),220);strokeWeight(random(2,4));for(let i=1;i<=6;i++){let t=i/6,nx=lerp(x,ex,t)+(i<6?random(-13,13):0),ny=lerp(y,ey,t)+(i<6?random(-13,13):0);line(lx,ly,nx,ny);lx=nx;ly=ny}}
function drawCharacter(pal){let j=MODS.faceJitter.value+wiggleHit*.4;push();translate(random(-j,j),random(-j*.45,j*.45));drawBody(pal);drawHat(pal);drawFace(pal);drawHearts(pal);updateHairs(pal);pop()}
function ink(pal,a=255){stroke(...(invertFlash?pal.bg:pal.ink),a)}
function drawHat(pal){ink(pal);noFill();strokeWeight(6);beginShape();vertex(-180,15);vertex(-115,-3);vertex(0,5);vertex(115,-2);vertex(187,14);vertex(130,38);vertex(0,48);vertex(-128,39);endShape(CLOSE);strokeWeight(6);beginShape();vertex(-112,-5);vertex(-128,-205);vertex(-90,-230);vertex(0,-240);vertex(95,-226);vertex(125,-205);vertex(108,-8);endShape(CLOSE);strokeWeight(7);line(-120,-110,115,-110);line(-118,-92,113,-92);for(let x=-105;x<=105;x+=10){strokeWeight(random(1,3));line(x+random(-4,4),-205+random(-7,7),x+random(-4,4),-18)}}
function drawFace(pal){ink(pal);noFill();strokeWeight(4);beginShape();vertex(-118,25);vertex(-105,95);vertex(-62,145);vertex(0,166);vertex(67,142);vertex(110,86);vertex(117,25);endShape();strokeWeight(5);line(0,70,-25,145);line(0,70,31,145);drawEye(-58,65,pal);drawEye(60,62,pal);for(let i=0;i<6;i++){strokeWeight(random(1,3));line(-100,35+i,-42,22+random(-4,4));line(36,22+random(-4,4),102,34+i)}}
function drawEye(x,y,pal){ink(pal);strokeWeight(4);noFill();arc(x,y,74,50,PI,TWO_PI);line(x-35,y+7,x+38,y+7);let a=AUDIO_SOURCE==='auto'?sin(frameCount*.025+x)*.9:atan2(mouseY-height*.48-y,mouseX-width*.5-x),amt=9+MODS.faceJitter.value*.45;noStroke();fill(...pal.ink);ellipse(x+cos(a)*amt,y+sin(a)*7,18+MODS.faceJitter.value*.25)}
function drawBody(pal){ink(pal);noFill();strokeWeight(6);beginShape();vertex(-20,260);vertex(-85,285);vertex(-165,330);vertex(-190,415);vertex(190,415);vertex(168,330);vertex(80,285);vertex(20,260);endShape();for(let i=0;i<70;i++){strokeWeight(random(1,4));let x1=random(-180,180),y1=random(280,410);line(x1,y1,x1+random(-100,100),y1+random(-30,65))}}
function updateHairs(pal){let bassStretch=MODS.beardStretch.value+stretchHit*.075,wig=MODS.hairWrithe.value+wiggleHit,push=MODS.beardPush.value+shock*5;for(let h of hairs){let sway=sin(frameCount*.055+h.seed)*wig;let desiredX=h.bx+(h.side?Math.sign(h.bx)*(h.len*.65+push*.45):sway+Math.sign(h.bx||1)*push*.18);let desiredY=h.by+(h.side?sin(frameCount*.035+h.seed)*18:h.len*bassStretch);if(shock>1){let m=sqrt(h.bx*h.bx+h.by*h.by)||1;desiredX+=h.bx/m*shock*13;desiredY+=h.by/m*shock*8}h.vx+=(desiredX-h.tx)*.065;h.vy+=(desiredY-h.ty)*.065;h.vx+=random(-1,1)*staticEnergy*.03;h.vy+=random(-1,1)*staticEnergy*.018;h.vx*=.82;h.vy*=.82;if(!FROZEN){h.tx+=h.vx;h.ty+=h.vy}ink(pal,230);strokeWeight(random(.8,2.5));noFill();let mx=lerp(h.bx,h.tx,.5)+sin(h.seed+frameCount*.04)*wig*.22,my=lerp(h.by,h.ty,.5);beginShape();vertex(h.bx,h.by);vertex(mx,my);vertex(h.tx,h.ty);endShape();if(random()<.18){strokeWeight(.6);line(h.bx+3,h.by,h.tx+random(-5,5),h.ty)}}}
function drawHearts(pal){let base=MODS.heartPulse.value+heartBurst*.045;for(let i=0;i<hearts.length;i++){let h=hearts[i],beat=1+(nrm.bass*.25)*sin(frameCount*.45+i);push();translate(h[0],h[1]);scale(base*beat);drawHeart(h[2],pal,i);pop()}}
function drawHeart(s,pal,i){ink(pal);noFill();for(let k=0;k<4;k++){strokeWeight(random(1.4,3));beginShape();for(let n=0;n<=40;n++){let t=map(n,0,40,0,TWO_PI),hx=16*pow(sin(t),3),hy=-(13*cos(t)-5*cos(2*t)-2*cos(3*t)-cos(4*t));vertex(hx*s*.03+random(-1.5,1.5),hy*s*.03+random(-1.5,1.5))}endShape()}}
function drawRipples(pal){for(let i=ripples.length-1;i>=0;i--){let r=ripples[i];if(!FROZEN){r.rad+=r.speed;r.a-=4.5}stroke(...pal.ink,r.a);strokeWeight(2);noFill();ellipse(r.x,r.y,r.rad*2,r.rad*.85);if(r.a<=0)ripples.splice(i,1)}}
function addRipple(x=width*.5,y=height*.77,power=1){ripples.push({x,y,rad:10,a:220,speed:2.5+power*2.8});if(ripples.length>14)ripples.shift()}
function trigger(name,remote=false){lastControl=Date.now();if(name==='shock'){shock=15;heartBurst=7;roomPulse=18;addRipple(width*.5,height*.72,2)}if(name==='storm')storm=12;if(name==='hearts')heartBurst=10;if(name==='ripple'){roomPulse=24;for(let i=0;i<3;i++)addRipple(random(width*.25,width*.75),random(height*.63,height*.9),2)}if(name==='stretch')stretchHit=14;if(name==='wiggle')wiggleHit=30;if(name==='invert')invertFlash=12;if(name==='reset')buildScene();publishState()}
function runAuto(){let idle=!lastControl||Date.now()-lastControl>22000;if(AUTO_CRUISE&&started&&idle&&millis()-lastAuto>2600+random(5200)){lastAuto=millis();trigger(random(['shock','storm','hearts','ripple','stretch','wiggle']))}}
function cyclePalette(){paletteIndex=(paletteIndex+1)%PALETTES.length;publishState()}function toggleAuto(){AUTO_CRUISE=!AUTO_CRUISE;if(AUTO_CRUISE)lastControl=0;publishState()}function toggleFreeze(){FROZEN=!FROZEN;publishState()}function togglePanel(){SHOW_PANEL=!SHOW_PANEL;panel.style.display=SHOW_PANEL?'block':'none';if(SHOW_PANEL)buildPanel()}
function drawHUD(){if(!SHOW_HUD){hud.textContent='';return}let bar=b=>'▮'.repeat(floor(nrm[b]*8))+'·'.repeat(8-floor(nrm[b]*8));hud.textContent=`LOVE STATIC // ${AUDIO_SOURCE.toUpperCase()} ${AUDIO_SOURCE==='music'?TRACKS[currentTrack]:''}\nSUB ${bar('sub')}  BASS ${bar('bass')}  LM ${bar('lowMid')}\nMID ${bar('mid')}  HIGH ${bar('high')}  AIR ${bar('air')}\nPAL ${PALETTES[paletteIndex].name}  SENS ${SENSITIVITY.toFixed(1)}  AUTO ${AUTO_CRUISE?'ON':'OFF'}  FPS ${frameRate().toFixed(0)}\nH:deck  S:mods  F:full  remote:${mqttClient&&mqttClient.connected?'ON':'off'}`}
function buildPanel(){let html='<h2>LOVE STATIC // MOD BAY</h2><div class="slot"><h3>GLOBAL</h3>'+rangeHTML('SENSITIVITY',SENSITIVITY,.2,3,.05)+'<div class="mini"><button id="normToggle">NORMALIZE '+(NORMALIZE?'ON':'OFF')+'</button><button id="densityToggle">DENSITY '+DENSITY+'</button></div></div>';for(let [k,m] of Object.entries(MODS)){html+=`<div class="slot" data-mod="${k}"><h3>${m.name}</h3><div class="row"><label>band</label><select data-p="band">${BANDS.map(b=>`<option ${b===m.band?'selected':''}>${b}</option>`).join('')}</select></div>${rangeHTML('min',m.min,0,k==='heartPulse'||k==='beardStretch'?3:k==='lightning'?2:k==='scratches'?1:120,.01)}${rangeHTML('max',m.max,0,k==='heartPulse'||k==='beardStretch'?4:k==='lightning'?2:k==='scratches'?1:160,.01)}${rangeHTML('curve',m.curve,.2,3,.05)}${rangeHTML('attack',m.attack,.01,1,.01)}${rangeHTML('release',m.release,.01,.7,.01)}</div>`}panel.innerHTML=html;panel.querySelector('[data-name="SENSITIVITY"]').oninput=e=>{SENSITIVITY=Number(e.target.value);e.target.nextElementSibling.textContent=SENSITIVITY.toFixed(2)};normToggle.onclick=()=>{NORMALIZE=!NORMALIZE;buildPanel()};densityToggle.onclick=()=>{DENSITY=DENSITY%3+1;buildScene();buildPanel()};panel.querySelectorAll('[data-mod]').forEach(slot=>{let m=MODS[slot.dataset.mod];slot.querySelectorAll('select,input').forEach(el=>el.oninput=()=>{let p=el.dataset.p||el.dataset.name;m[p]=p==='band'?el.value:Number(el.value);let out=el.nextElementSibling;if(out&&out.classList.contains('value'))out.textContent=Number(el.value).toFixed(2);publishState()})})}
function rangeHTML(name,val,min,max,step){return `<div class="row"><label>${name}</label><input data-name="${name}" data-p="${name}" type="range" min="${min}" max="${max}" step="${step}" value="${val}"><span class="value">${Number(val).toFixed(2)}</span></div>`}
function keyPressed(){let k=key.toLowerCase();lastControl=Date.now();if(k==='h')toggleDeck();if(k==='s')togglePanel();if(k==='q')trigger('shock');if(k==='w')trigger('storm');if(k==='e')trigger('hearts');if(k==='r')trigger('ripple');if(k==='t')trigger('invert');if(k==='y')trigger('stretch');if(k==='u')trigger('wiggle');if(k==='p')cyclePalette();if(k==='a')toggleAuto();if(k==='0')SHOW_HUD=!SHOW_HUD;if(k==='f')fullscreen(!fullscreen());if(k==='m')nextTrack();if(k===' ')toggleFreeze();if(key==='+'||key==='=')SENSITIVITY=min(3,SENSITIVITY+.1);if(key==='-'||key==='_')SENSITIVITY=max(.2,SENSITIVITY-.1);return false}
function mousePressed(){if(started&&!SHOW_PANEL&&mouseY<height-70){lastControl=Date.now();if(mouseY>height*.55)addRipple(mouseX,mouseY,1.2);else trigger('wiggle')}}function touchStarted(){mousePressed();return false}
function windowResized(){resizeCanvas(windowWidth,windowHeight);buildScene()}
// MQTT REMOTE
const MQTT_URL='wss://broker.hivemq.com:8884/mqtt',MQTT_SESSION='lovestatic-ooakosimo';let mqttClient=null;function topic(){return 'ooakosimo/lovestatic/'+MQTT_SESSION}function connectMQTT(){if(!window.mqtt)return;mqttClient=mqtt.connect(MQTT_URL,{clientId:'lovestatic_visual_'+Math.random().toString(16).slice(2),reconnectPeriod:3000,clean:true});mqttClient.on('connect',()=>{mqttClient.subscribe(topic()+'/cmd');publishState()});mqttClient.on('message',(t,p)=>{try{handleRemote(JSON.parse(p.toString()))}catch(e){}})}function handleRemote(c){lastControl=Date.now();if(c.type==='trigger')trigger(c.name,true);if(c.type==='action'){if(c.name==='palette')cyclePalette();if(c.name==='auto')toggleAuto();if(c.name==='freeze')toggleFreeze();if(c.name==='hud')SHOW_HUD=!SHOW_HUD;if(c.name==='deck')toggleDeck()}if(c.type==='set'&&c.path==='sensitivity')SENSITIVITY=constrain(Number(c.value),.2,3);if(c.type==='set'&&c.path==='micGain'){MIC_GAIN=constrain(Number(c.value),.2,8);if(micGainNode)micGainNode.gain.value=MIC_GAIN}publishState()}function publishState(){if(mqttClient&&mqttClient.connected)mqttClient.publish(topic()+'/state',JSON.stringify({type:'state',palette:PALETTES[paletteIndex].name,sensitivity:SENSITIVITY,micGain:MIC_GAIN,auto:AUTO_CRUISE,frozen:FROZEN,source:AUDIO_SOURCE,track:currentTrack,fps:round(frameRate())}),{retain:true})}
</script>
</body>
