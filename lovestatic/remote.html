<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LOVE STATIC // REMOTE</title><link rel="icon" href="/gumamela.gif" type="image/gif"><script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script><style>
:root{--paper:#d8ceb8;--ink:#15130f;--cream:#eee6d5;--red:#8f2f2a;--green:#4f9d64}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:13px 'Courier New',monospace;touch-action:manipulation}header{position:sticky;top:0;z-index:5;padding:10px;background:#d8ceb8f2;border-bottom:3px solid var(--ink)}h1{margin:0 0 6px;font-size:18px;letter-spacing:1px}.status{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.dot{width:10px;height:10px;border-radius:50%;background:#b33}.dot.ok{background:var(--green);box-shadow:0 0 8px var(--green)}main{max-width:850px;margin:auto;padding:10px}.card{margin:10px 0;padding:10px;border:2px solid var(--ink);background:#eee6d5aa}.card h2{margin:0 0 8px;font-size:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}button{min-height:58px;padding:8px;border:2px solid var(--ink);background:var(--cream);color:var(--ink);box-shadow:4px 4px var(--ink);font:900 12px 'Courier New';cursor:pointer;touch-action:manipulation}button:active{transform:translate(2px,2px);box-shadow:1px 1px var(--ink);background:var(--ink);color:var(--cream)}.danger{background:#8f2f2a;color:#fff}.tiny{min-height:30px;padding:4px 8px;font-size:10px;box-shadow:2px 2px var(--ink)}.row{display:flex;align-items:center;gap:8px;margin:10px 0}.row label{width:110px;font-weight:bold}.row input{flex:1}.val{width:42px;text-align:right}.small{font-size:10px;opacity:.75;line-height:1.45}@media(max-width:560px){.grid{grid-template-columns:repeat(3,1fr)}button{min-height:56px;font-size:11px}.row label{width:92px}}
</style></head><body><header><h1>LOVE STATIC // REMOTE</h1><div class="status"><span id="dot" class="dot"></span><span id="statusText">starting…</span><button id="retry" class="tiny">RECONNECT</button></div></header><main>
<div class="card"><h2>PERFORMANCE</h2><div class="grid"><button class="danger" data-trigger="shock">LOVE SHOCK</button><button data-trigger="storm">LIGHTNING</button><button data-trigger="hearts">HEARTS</button><button data-trigger="ripple">RIPPLE</button><button data-trigger="stretch">STRETCH</button><button data-trigger="wiggle">WIGGLE</button><button data-trigger="invert">INVERT</button><button data-trigger="reset">RESET</button></div></div>
<div class="card"><h2>SCENE</h2><div class="grid"><button data-action="palette">PALETTE</button><button data-action="auto">AUTO</button><button data-action="freeze">FREEZE</button><button data-action="hud">HUD</button><button data-action="deck">ON-SCREEN DECK</button></div></div>
<div class="card"><h2>INPUT</h2><div class="row"><label>SENSITIVITY</label><input id="sens" type="range" min="0.2" max="3" step="0.05" value="1.15"><span id="sensv" class="val">1.15</span></div><div class="row"><label>MIC GAIN</label><input id="gain" type="range" min="0.2" max="8" step="0.1" value="1.6"><span id="gainv" class="val">1.6</span></div><div class="small">P2P remote via PeerJS/WebRTC on ordinary HTTPS/443. Open only one LOVE STATIC visual at a time, start AUTO / MUSIC / MIC there, then open this remote.</div></div>
<div class="card"><h2>VISUAL STATUS</h2><div id="readout">waiting for visual…</div></div>
</main><script>
const VISUAL_ID='ooakosimo-lovestatic-vj';
const statusEl=document.getElementById('statusText'),dotEl=document.getElementById('dot'),readoutEl=document.getElementById('readout'),sensEl=document.getElementById('sens'),sensValEl=document.getElementById('sensv'),gainEl=document.getElementById('gain'),gainValEl=document.getElementById('gainv'),retryEl=document.getElementById('retry');
let peer=null,conn=null,retryTimer=null,lastState=null;
function setStatus(t,ok=false){statusEl.textContent=t;dotEl.classList.toggle('ok',ok)}
function scheduleRetry(ms=2500){clearTimeout(retryTimer);retryTimer=setTimeout(()=>{if(!conn||!conn.open)connectToVisual()},ms)}
function startPeer(){
 try{if(peer&&!peer.destroyed)peer.destroy()}catch(e){}
 conn=null;setStatus('connecting to PeerJS…');
 if(!window.Peer){setStatus('PeerJS library unavailable');return}
 peer=new Peer(undefined,{debug:1});
 peer.on('open',()=>{setStatus('signal online · looking for visual',true);connectToVisual()});
 peer.on('disconnected',()=>{setStatus('signal reconnecting…');try{peer.reconnect()}catch(e){}});
 peer.on('error',e=>{
   if(e&&e.type==='peer-unavailable'){setStatus('visual not found · keep visual open');scheduleRetry(2200);return}
   setStatus('peer error: '+((e&&e.type)||'network'));console.warn('LOVE STATIC remote PeerJS',e);scheduleRetry(3500)
 });
}
function connectToVisual(){
 if(!peer||peer.destroyed||!peer.open){startPeer();return}
 if(conn&&conn.open)return;
 setStatus('connecting to visual…',true);
 try{
   conn=peer.connect(VISUAL_ID,{reliable:true});
   conn.on('open',()=>{setStatus('VISUAL ONLINE',true);send({type:'hello'});});
   conn.on('data',data=>{try{lastState=data;if(!data||data.type!=='state')return;setStatus('VISUAL ONLINE',true);readoutEl.textContent=`source ${data.source||'?'} · audio ${data.audio||'?'} · palette ${data.palette||'?'} · sens ${Number(data.sensitivity||0).toFixed(2)} · auto ${data.auto?'ON':'OFF'} · freeze ${data.frozen?'ON':'OFF'} · fps ${data.fps||0}`;if(document.activeElement!==sensEl){sensEl.value=data.sensitivity||sensEl.value;sensValEl.textContent=Number(sensEl.value).toFixed(2)}if(document.activeElement!==gainEl){gainEl.value=data.micGain||gainEl.value;gainValEl.textContent=Number(gainEl.value).toFixed(1)}}catch(e){console.warn('LOVE STATIC remote state',e)}});
   conn.on('close',()=>{setStatus('visual disconnected');conn=null;scheduleRetry()});
   conn.on('error',e=>{setStatus('visual connection error');console.warn('LOVE STATIC data connection',e);conn=null;scheduleRetry()});
 }catch(e){setStatus('connect failed');console.warn(e);scheduleRetry()}
}
function send(x){if(conn&&conn.open){try{conn.send(x);return true}catch(e){}}setStatus('not connected · tap RECONNECT');scheduleRetry(500);return false}
document.querySelectorAll('[data-trigger]').forEach(b=>b.addEventListener('click',()=>send({type:'trigger',name:b.dataset.trigger})));document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>send({type:'action',name:b.dataset.action})));
sensEl.oninput=()=>{sensValEl.textContent=Number(sensEl.value).toFixed(2);send({type:'set',path:'sensitivity',value:Number(sensEl.value)})};gainEl.oninput=()=>{gainValEl.textContent=Number(gainEl.value).toFixed(1);send({type:'set',path:'micGain',value:Number(gainEl.value)})};retryEl.addEventListener('click',()=>{clearTimeout(retryTimer);startPeer()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(!conn||!conn.open))scheduleRetry(200)});startPeer();
</script></body></html>
