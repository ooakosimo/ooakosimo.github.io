<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LOVE STATIC // REMOTE</title><link rel="icon" href="/gumamela.gif" type="image/gif"><script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script><style>
:root{--paper:#d8ceb8;--ink:#15130f;--cream:#eee6d5;--red:#8f2f2a;--green:#4f9d64}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:13px 'Courier New',monospace;touch-action:manipulation}header{position:sticky;top:0;z-index:5;padding:10px;background:#d8ceb8f2;border-bottom:3px solid var(--ink)}h1{margin:0 0 6px;font-size:18px;letter-spacing:1px}.status{display:flex;align-items:center;gap:7px}.dot{width:10px;height:10px;border-radius:50%;background:#b33}.dot.ok{background:var(--green);box-shadow:0 0 8px var(--green)}main{max-width:850px;margin:auto;padding:10px}.card{margin:10px 0;padding:10px;border:2px solid var(--ink);background:#eee6d5aa}.card h2{margin:0 0 8px;font-size:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}button{min-height:58px;padding:8px;border:2px solid var(--ink);background:var(--cream);color:var(--ink);box-shadow:4px 4px var(--ink);font:900 12px 'Courier New';cursor:pointer}button:active{transform:translate(2px,2px);box-shadow:1px 1px var(--ink);background:var(--ink);color:var(--cream)}.danger{background:#8f2f2a;color:#fff}.row{display:flex;align-items:center;gap:8px;margin:10px 0}.row label{width:110px;font-weight:bold}.row input{flex:1}.val{width:42px;text-align:right}.small{font-size:10px;opacity:.7}@media(max-width:560px){.grid{grid-template-columns:repeat(3,1fr)}button{min-height:56px;font-size:11px}.row label{width:92px}}
</style></head><body><header><h1>LOVE STATIC // REMOTE</h1><div class="status"><span id="dot" class="dot"></span><span id="status">connecting…</span></div></header><main>
<div class="card"><h2>PERFORMANCE</h2><div class="grid"><button class="danger" data-trigger="shock">LOVE SHOCK</button><button data-trigger="storm">LIGHTNING</button><button data-trigger="hearts">HEARTS</button><button data-trigger="ripple">RIPPLE</button><button data-trigger="stretch">STRETCH</button><button data-trigger="wiggle">WIGGLE</button><button data-trigger="invert">INVERT</button><button data-trigger="reset">RESET</button></div></div>
<div class="card"><h2>SCENE</h2><div class="grid"><button data-action="palette">PALETTE</button><button data-action="auto">AUTO</button><button data-action="freeze">FREEZE</button><button data-action="hud">HUD</button><button data-action="deck">ON-SCREEN DECK</button></div></div>
<div class="card"><h2>INPUT</h2><div class="row"><label>SENSITIVITY</label><input id="sens" type="range" min="0.2" max="3" step="0.05" value="1.15"><span id="sensv" class="val">1.15</span></div><div class="row"><label>MIC GAIN</label><input id="gain" type="range" min="0.2" max="8" step="0.1" value="1.6"><span id="gainv" class="val">1.6</span></div><div class="small">Remote + visual use public HiveMQ WebSocket session: lovestatic-ooakosimo. Both pages must be online.</div></div>
<div class="card"><h2>VISUAL STATUS</h2><div id="readout">waiting for visual…</div></div>
</main><script>
const URL='wss://broker.hivemq.com:8884/mqtt',SESSION='lovestatic-ooakosimo',topic=()=>`ooakosimo/lovestatic/${SESSION}`;let client=null,lastState=null;
function setStatus(t,ok=false){status.textContent=t;dot.classList.toggle('ok',ok)}function connect(){client=mqtt.connect(URL,{clientId:'lovestatic_remote_'+Math.random().toString(16).slice(2),reconnectPeriod:3000,clean:true});client.on('connect',()=>{setStatus('remote online · waiting for visual',true);client.subscribe(topic()+'/state')});client.on('reconnect',()=>setStatus('reconnecting…'));client.on('error',()=>setStatus('broker unavailable'));client.on('message',(t,p)=>{try{lastState=JSON.parse(p.toString());setStatus('visual online',true);readout.textContent=`source ${lastState.source||'?'} · palette ${lastState.palette||'?'} · sens ${Number(lastState.sensitivity||0).toFixed(2)} · auto ${lastState.auto?'ON':'OFF'} · freeze ${lastState.frozen?'ON':'OFF'} · fps ${lastState.fps||0}`;if(document.activeElement!==sens){sens.value=lastState.sensitivity||sens.value;sensv.textContent=Number(sens.value).toFixed(2)}if(document.activeElement!==gain){gain.value=lastState.micGain||gain.value;gainv.textContent=Number(gain.value).toFixed(1)}}catch(e){}})}function send(x){if(client&&client.connected)client.publish(topic()+'/cmd',JSON.stringify(x))}
document.querySelectorAll('[data-trigger]').forEach(b=>b.onclick=()=>send({type:'trigger',name:b.dataset.trigger}));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>send({type:'action',name:b.dataset.action}));sens.oninput=()=>{sensv.textContent=Number(sens.value).toFixed(2);send({type:'set',path:'sensitivity',value:Number(sens.value)})};gain.oninput=()=>{gainv.textContent=Number(gain.value).toFixed(1);send({type:'set',path:'micGain',value:Number(gain.value)})};document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(!client||!client.connected))connect()});connect();
</script></body></html>
