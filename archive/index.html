<!-- =====================================================================
  OOAKOSIMO SHADER ARCHIVE — live instruments, not screenshots.
  Static single file. No build. No platform. Yours.

  HOW TO ADD A SHADER:
    1. Open this file, find `const SHADERS = [`
    2. Add an entry: { id, title, date, origin, tags:[], src:`...` }
       where src is the whole .fs file (header comment included).
       Escape backticks in the shader with \` if any (none so far).
    3. Save. Done. The runtime parses the ISF header and builds the
       preview + controls automatically.
  ===================================================================== -->
<style>
  :root{
    --ink:#060a10;
    --panel:rgba(12,16,22,.92);
    --line:rgba(80,150,220,.22);
    --cyan:#78dcff;
    --hud:rgba(120,170,220,.72);
    --paper:#EEE8DE;
    --warm:#F5943F;
    --mono:'Courier New', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--ink); color:var(--hud);
    font-family:var(--mono); font-size:14px; }
  ::selection{ background:var(--cyan); color:var(--ink); }

  /* ---------- hero ---------- */
  #hero{ position:relative; height:62vh; min-height:380px; overflow:hidden;
    border-bottom:1px solid var(--line); }
  #heroCanvas{ position:absolute; inset:0; width:100%; height:100%; display:block;
    filter:saturate(.9); }
  #hero .veil{ position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(6,10,16,.25) 0%, rgba(6,10,16,.55) 70%, var(--ink) 100%); }
  #hero .hud{ position:absolute; left:20px; bottom:26px; right:20px; }
  #hero h1{ margin:0 0 6px; color:var(--paper); font-size:clamp(22px,4.6vw,44px);
    font-weight:700; letter-spacing:.22em; text-transform:uppercase; }
  #hero h1 .x{ color:var(--cyan); }
  #hero .sub{ letter-spacing:.14em; text-transform:uppercase; font-size:12px; }
  #meter{ margin-top:14px; font-size:12px; color:var(--hud); white-space:pre;
    letter-spacing:.06em; }
  #micBtn{ position:absolute; top:16px; right:16px; background:var(--panel);
    color:var(--cyan); border:1px solid var(--line); font-family:inherit;
    font-size:12px; letter-spacing:.18em; text-transform:uppercase;
    padding:9px 14px; cursor:pointer; }
  #micBtn:hover, #micBtn:focus-visible{ border-color:var(--cyan); outline:none; }
  #micBtn.on{ color:var(--warm); border-color:var(--warm); }

  /* ---------- grid ---------- */
  #grid{ display:grid; gap:18px; padding:26px 20px 10px;
    grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    max-width:1280px; margin:0 auto; }
  .card{ background:var(--panel); border:1px solid var(--line); }
  .card .view{ position:relative; aspect-ratio:4/3; cursor:pointer; }
  .card canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .card .paused{ position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; color:var(--cyan); letter-spacing:.3em; font-size:12px;
    background:rgba(6,10,16,.55); text-transform:uppercase; }
  .card .body{ padding:12px 14px 14px; border-top:1px solid var(--line); }
  .card h2{ margin:0; font-size:15px; color:var(--paper); font-weight:700;
    letter-spacing:.16em; text-transform:uppercase; }
  .card h2 .x{ color:var(--cyan); }
  .card .date{ font-size:11px; letter-spacing:.14em; margin-top:3px; }
  .card .origin{ font-size:12px; line-height:1.55; margin:8px 0 10px; color:var(--hud); }
  .tags{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .tag{ font-size:10px; letter-spacing:.12em; padding:2px 7px;
    border:1px solid var(--line); color:var(--cyan); text-transform:lowercase; }
  .row{ display:flex; gap:8px; }
  .btn{ flex:1; background:none; border:1px solid var(--line); color:var(--cyan);
    font-family:inherit; font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    padding:8px 6px; cursor:pointer; }
  .btn:hover, .btn:focus-visible{ border-color:var(--cyan); outline:none; }
  .btn.done{ color:var(--warm); border-color:var(--warm); }
  details{ margin-top:10px; border-top:1px dashed var(--line); padding-top:8px; }
  summary{ cursor:pointer; font-size:11px; letter-spacing:.2em; text-transform:uppercase;
    color:var(--cyan); }
  summary:focus-visible{ outline:1px solid var(--cyan); }
  .param{ display:grid; grid-template-columns: 96px 1fr 44px; gap:8px;
    align-items:center; margin-top:7px; font-size:11px; }
  .param label{ letter-spacing:.06em; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; }
  .param input[type=range]{ width:100%; accent-color:var(--cyan); }
  .param input[type=color]{ width:100%; height:22px; border:1px solid var(--line);
    background:none; padding:0; }
  .param .v{ text-align:right; color:var(--paper); }

  footer{ max-width:1280px; margin:0 auto; padding:22px 20px 40px; font-size:11px;
    letter-spacing:.14em; text-transform:uppercase; display:flex; gap:14px;
    flex-wrap:wrap; justify-content:space-between; }
  footer .sig{ color:var(--cyan); }

  @media (prefers-reduced-motion: reduce){
    /* previews start paused; user starts each by hand */
  }
</style>
</head>
<body>

<header id="hero">
  <canvas id="heroCanvas"></canvas>
  <div class="veil"></div>
  <button id="micBtn" type="button" aria-pressed="false">audio: sim</button>
  <div class="hud">
    <h1>OOAKOSIMO <span class="x">::</span> SHADER ARCHIVE</h1>
    <div class="sub">live instruments — every preview runs the real .fs, fed by the meter below</div>
    <div id="meter">in:[------------] 0</div>
  </div>
</header>

<main id="grid"></main>

<footer>
  <span class="sig">static html :: no build :: no platform :: yours</span>
  <span id="count"></span>
</footer>

<script>
"use strict";
/* ================= SHADER DATA (injected) ================= */
const SHADERS = [{"id": "OOAK_ChamberPulse", "title": "CHAMBER :: PULSE", "date": "2026.07.18", "origin": "the first custom ISF. square tunnel breathing on bass, ring density on mids, shimmer on highs. black background: holo-gauze ready.", "tags": ["tunnel", "bass", "holo-ready", "generator"], "hero": false, "src": "/*{\n  \"DESCRIPTION\": \"Chamber Pulse - concentric tunnel breathing with bass, line density on mids, shimmer on highs. Black BG = holo-gauze friendly.\",\n  \"CREDIT\": \"OOAKOSIMO + Claude\",\n  \"ISFVSN\": \"2\",\n  \"CATEGORIES\": [\"GENERATOR\"],\n  \"INPUTS\": [\n    { \"NAME\": \"fft\", \"TYPE\": \"audioFFT\" },\n    { \"NAME\": \"sens\",    \"TYPE\": \"float\", \"LABEL\": \"Sensitivity\",   \"DEFAULT\": 1.5, \"MIN\": 0.0, \"MAX\": 5.0 },\n    { \"NAME\": \"density\", \"TYPE\": \"float\", \"LABEL\": \"Ring density\",  \"DEFAULT\": 14.0, \"MIN\": 3.0, \"MAX\": 40.0 },\n    { \"NAME\": \"speed\",   \"TYPE\": \"float\", \"LABEL\": \"Travel speed\",  \"DEFAULT\": 0.6, \"MIN\": -2.0, \"MAX\": 2.0 },\n    { \"NAME\": \"hueA\",    \"TYPE\": \"color\", \"LABEL\": \"Color low\",     \"DEFAULT\": [0.0, 0.6, 1.0, 1.0] },\n    { \"NAME\": \"hueB\",    \"TYPE\": \"color\", \"LABEL\": \"Color high\",    \"DEFAULT\": [1.0, 0.2, 0.8, 1.0] }\n  ]\n}*/\n\nfloat band(float x) {\n  // THE WHOLE TRICK IS THIS LINE:\n  // the FFT is a texture; x picks the frequency (0=low, 1=high),\n  // the .r value is that band's loudness right now.\n  return IMG_NORM_PIXEL(fft, vec2(x, 0.5)).r;\n}\n\nvoid main() {\n  // centered coords, aspect corrected\n  vec2 uv = isf_FragNormCoord - 0.5;\n  uv.x *= RENDERSIZE.x / RENDERSIZE.y;\n\n  // pull three bands and scale by sensitivity\n  float bass = band(0.03) * sens;   // kick / low end\n  float mids = band(0.25) * sens;   // body / snare-ish\n  float high = band(0.70) * sens;   // hats / air\n\n  // tunnel geometry: distance from center, warped square-ish like a chamber\n  float d = max(abs(uv.x), abs(uv.y));           // square tunnel; use length(uv) for round\n  d += bass * 0.15 * sin(TIME * 2.0);            // bass makes the whole chamber breathe\n\n  // concentric rings traveling inward; mids add extra rings\n  float rings = fract(d * (density + mids * 10.0) - TIME * speed);\n  float line  = smoothstep(0.5, 0.45, rings) * smoothstep(0.35, 0.4, rings);\n\n  // highs sprinkle shimmer along the lines\n  float sparkle = high * fract(sin(dot(uv, vec2(127.1, 311.7)) + TIME) * 43758.5) * line;\n\n  // color blends from hueA (center) to hueB (edge), brightness rides the bass\n  vec3 col = mix(hueA.rgb, hueB.rgb, d * 1.6);\n  col = col * line * (0.6 + bass * 1.2) + sparkle;\n\n  // pure black background where there are no lines -> transparent on holo gauze\n  gl_FragColor = vec4(col, 1.0);\n}\n"}, {"id": "OOAK_EtherealDrift", "title": "ETHEREAL :: DRIFT", "date": "2026.07.18", "origin": "reimagining of the p5.js piece — noise ribbons, drifting motes, fbm nebula, spectrum horizon. resolution-independent, costs the gpu nothing.", "tags": ["ribbons", "particles", "spectrum", "reimagined"], "hero": false, "src": "/*{\n  \"DESCRIPTION\": \"Ethereal Drift - ISF reimagining of the p5.js piece. Noise ribbons, drifting motes, fbm nebula, spectrum horizon, grain. Bass=amplitude/brightness, mids=ribbon thickness/speed, treble=jitter/shimmer.\",\n  \"CREDIT\": \"OOAKOSIMO + Claude\",\n  \"ISFVSN\": \"2\",\n  \"CATEGORIES\": [\"GENERATOR\"],\n  \"INPUTS\": [\n    { \"NAME\": \"fft\", \"TYPE\": \"audioFFT\" },\n    { \"NAME\": \"sens\",     \"TYPE\": \"float\", \"LABEL\": \"Sensitivity\",     \"DEFAULT\": 1.5, \"MIN\": 0.0, \"MAX\": 5.0 },\n    { \"NAME\": \"driftSpd\", \"TYPE\": \"float\", \"LABEL\": \"Drift speed\",     \"DEFAULT\": 0.6, \"MIN\": 0.0, \"MAX\": 2.0 },\n    { \"NAME\": \"grainAmt\", \"TYPE\": \"float\", \"LABEL\": \"Grain\",           \"DEFAULT\": 0.06,\"MIN\": 0.0, \"MAX\": 0.3 },\n    { \"NAME\": \"horizon\",  \"TYPE\": \"float\", \"LABEL\": \"Spectrum height\", \"DEFAULT\": 0.32,\"MIN\": 0.0, \"MAX\": 0.8 },\n    { \"NAME\": \"colCyan\",  \"TYPE\": \"color\", \"LABEL\": \"Cyan\",   \"DEFAULT\": [0.47, 0.86, 1.0, 1.0] },\n    { \"NAME\": \"colViolet\",\"TYPE\": \"color\", \"LABEL\": \"Violet\", \"DEFAULT\": [0.67, 0.59, 1.0, 1.0] }\n  ]\n}*/\n\nfloat hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }\n\nfloat vnoise(vec2 p){\n  vec2 i = floor(p), f = fract(p);\n  f = f*f*(3.0-2.0*f);\n  return mix( mix(hash(i), hash(i+vec2(1.,0.)), f.x),\n              mix(hash(i+vec2(0.,1.)), hash(i+vec2(1.,1.)), f.x), f.y);\n}\n\nfloat fbm(vec2 p){\n  float v = 0.0, a = 0.5;\n  for(int i=0;i<4;i++){ v += a*vnoise(p); p *= 2.1; a *= 0.5; }\n  return v;\n}\n\nfloat band(float x){ return IMG_NORM_PIXEL(fft, vec2(x, 0.5)).r; }\n\nvoid main(){\n  vec2 uv = isf_FragNormCoord;\n  float aspect = RENDERSIZE.x / RENDERSIZE.y;\n\n  // ---- audio (same three bands as the p5 piece) ----\n  float bass   = band(0.03) * sens;\n  float mids   = band(0.25) * sens;\n  float treble = band(0.70) * sens;\n\n  // ---- camera breathing (the push/scale/pop from draw()) ----\n  float zoom = 1.0 + sin(TIME*0.18)*0.06 + bass*0.03;\n  vec2 cuv = (uv - 0.5) / zoom + 0.5;\n  vec2 p = vec2(cuv.x * aspect, cuv.y);\n\n  float speed = (0.6 + mids*1.2) * driftSpd;\n  vec3 col = vec3(0.012, 0.024, 0.06);            // #03060F-ish base\n\n  // ---- nebula: fbm terrain in the upper region (drawNebula) ----\n  float neb = fbm(vec2(p.x*2.0, TIME*0.06) + p.y*1.5);\n  float nebMask = smoothstep(0.75, 0.2, cuv.y) * smoothstep(0.0, 0.35, cuv.y);\n  col += mix(colViolet.rgb, colCyan.rgb, neb) * neb * nebMask * (0.10 + treble*0.12);\n\n  // ---- ribbons: 7 glowing noise curves (drawRibbons) ----\n  for(int i=0;i<7;i++){\n    float fi = float(i);\n    float z = 0.3 + fract(fi*0.377)*0.6;                       // depth like r.z\n    float baseY = 0.2 + fract(fi*0.5) * 0.5;\n    float y = baseY\n      + sin(p.x*5.0 + TIME*speed*z + fi*1.3) * (0.06*z + bass*0.10)\n      + (vnoise(vec2(p.x*3.0, TIME*0.4 + fi*7.0)) - 0.5) * 0.16 * z;\n    float d = abs(cuv.y - y);\n    float thick = (0.002 + mids*0.006) * z;\n    float glow = thick / (d + 0.001);\n    col += mix(colCyan.rgb, colViolet.rgb, 0.5 + 0.5*sin(TIME + fi)) * glow * 0.14 * z;\n  }\n\n  // ---- drift motes: two depth layers of flowing points (drawParticles) ----\n  for(int L=0;L<2;L++){\n    float lz = (L==0) ? 0.45 : 1.0;                            // near/far layers\n    float cells = mix(14.0, 7.0, lz);\n    vec2 q = p * cells;\n    // the flow: cells slide through noise, echoing the p5 angle-field\n    float ang = vnoise(q*0.25 + TIME*0.1*lz) * 6.2831;\n    q += vec2(cos(ang), sin(ang)) * TIME * 0.15 * speed * lz;\n    vec2 id = floor(q);\n    vec2 gp = fract(q) - 0.5;\n    vec2 jitter = vec2(hash(id)-0.5, hash(id+9.7)-0.5) * 0.7;\n    jitter += (treble*0.15) * vec2(hash(id+TIME)-0.5, hash(id+TIME+3.3)-0.5);\n    float dd = length(gp - jitter);\n    float dot_ = smoothstep(0.05*lz*(0.9+treble*0.6), 0.0, dd);\n    col += mix(colCyan.rgb, vec3(0.94,0.96,1.0), lz) * dot_ * (0.25 + bass*0.5) * lz;\n  }\n\n  // ---- spectral horizon: the analyzer bars (drawSpectralHorizon) ----\n  float hY = 0.18;                                             // horizon from bottom\n  if(cuv.y < hY + 0.002 && cuv.y > 0.0){\n    float bx = floor(uv.x * 60.0) / 60.0;\n    float e = band(mix(0.02, 0.85, bx)) * sens;\n    float h = e * horizon;\n    float bar = step(hY - h, cuv.y) * step(fract(uv.x*60.0), 0.75);\n    col += mix(colCyan.rgb, colViolet.rgb, e) * bar * 0.55;\n    col += colCyan.rgb * smoothstep(0.004, 0.0, abs(cuv.y - hY)) * 0.25;\n  }\n\n  // ---- grain (drawGrain) ----\n  col += (hash(uv * RENDERSIZE.xy + fract(TIME)*100.0) - 0.5) * grainAmt;\n\n  gl_FragColor = vec4(col, 1.0);\n}\n"}, {"id": "OOAK_CircleTrails", "title": "CIRCLE :: TRAILS", "date": "2026.07.18", "origin": "the modV favorite, resurrected. persistent-buffer trails, autopilot lissajous head, bass size pulse, treble jitter. stop-motion soul intact.", "tags": ["trails", "multipass", "cartoon", "autopilot"], "hero": true, "src": "/*{\n  \"DESCRIPTION\": \"Circle Trails reimagined - persistent trail buffer like the modV original, now with autopilot motion (lissajous + wander), audio-reactive size and jitter, changeable background, all parameters exposed. autoMove 0 = drag the point yourself, 1 = it flies itself.\",\n  \"CREDIT\": \"OOAKOSIMO + Claude, after the VIDVOX original\",\n  \"ISFVSN\": \"2\",\n  \"CATEGORIES\": [\"GENERATOR\"],\n  \"INPUTS\": [\n    { \"NAME\": \"fft\", \"TYPE\": \"audioFFT\" },\n    { \"NAME\": \"pointInput\", \"TYPE\": \"point2D\", \"DEFAULT\": [0.5, 0.5], \"MIN\": [0.0, 0.0], \"MAX\": [1.0, 1.0] },\n    { \"NAME\": \"autoMove\",  \"TYPE\": \"float\", \"LABEL\": \"Autopilot\",        \"DEFAULT\": 1.0,  \"MIN\": 0.0, \"MAX\": 1.0 },\n    { \"NAME\": \"moveSpeed\", \"TYPE\": \"float\", \"LABEL\": \"Move speed\",       \"DEFAULT\": 0.5,  \"MIN\": 0.0, \"MAX\": 3.0 },\n    { \"NAME\": \"wander\",    \"TYPE\": \"float\", \"LABEL\": \"Wander\",           \"DEFAULT\": 0.15, \"MIN\": 0.0, \"MAX\": 0.5 },\n    { \"NAME\": \"sens\",      \"TYPE\": \"float\", \"LABEL\": \"Audio sensitivity\",\"DEFAULT\": 1.5,  \"MIN\": 0.0, \"MAX\": 5.0 },\n    { \"NAME\": \"sizePulse\", \"TYPE\": \"float\", \"LABEL\": \"Bass size pulse\",  \"DEFAULT\": 0.5,  \"MIN\": 0.0, \"MAX\": 2.0 },\n    { \"NAME\": \"jitterAmt\", \"TYPE\": \"float\", \"LABEL\": \"Treble jitter\",    \"DEFAULT\": 0.02, \"MIN\": 0.0, \"MAX\": 0.15 },\n    { \"NAME\": \"startSize\", \"TYPE\": \"float\", \"LABEL\": \"Head size\",        \"DEFAULT\": 0.12, \"MIN\": 0.0, \"MAX\": 0.8 },\n    { \"NAME\": \"endSize\",   \"TYPE\": \"float\", \"LABEL\": \"Tail size\",        \"DEFAULT\": 0.01, \"MIN\": 0.0, \"MAX\": 0.8 },\n    { \"NAME\": \"trailCount\",\"TYPE\": \"float\", \"LABEL\": \"Trail length\",     \"DEFAULT\": 24.0, \"MIN\": 1.0, \"MAX\": 64.0 },\n    { \"NAME\": \"strokeSize\",\"TYPE\": \"float\", \"LABEL\": \"Stroke width\",     \"DEFAULT\": 0.0,  \"MIN\": 0.0, \"MAX\": 0.3 },\n    { \"NAME\": \"bgColor\",    \"TYPE\": \"color\", \"LABEL\": \"Background\", \"DEFAULT\": [0.0, 0.0, 0.0, 1.0] },\n    { \"NAME\": \"startColor\", \"TYPE\": \"color\", \"LABEL\": \"Head color\", \"DEFAULT\": [0.96, 0.58, 0.18, 1.0] },\n    { \"NAME\": \"endColor\",   \"TYPE\": \"color\", \"LABEL\": \"Tail color\", \"DEFAULT\": [0.96, 0.90, 0.29, 1.0] },\n    { \"NAME\": \"strokeColor\",\"TYPE\": \"color\", \"LABEL\": \"Stroke\",     \"DEFAULT\": [0.0, 0.0, 0.0, 1.0] }\n  ],\n  \"PASSES\": [\n    { \"TARGET\": \"pointsBuffer\", \"PERSISTENT\": true, \"WIDTH\": \"64\", \"HEIGHT\": \"1\" },\n    { \"DESCRIPTION\": \"full-res draw pass\" }\n  ]\n}*/\n\nfloat hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }\n\nfloat vnoise(float x){\n  float i = floor(x), f = fract(x);\n  f = f*f*(3.0-2.0*f);\n  return mix(hash(vec2(i,7.0)), hash(vec2(i+1.0,7.0)), f);\n}\n\nfloat band(float x){ return IMG_NORM_PIXEL(fft, vec2(x, 0.5)).r; }\n\nfloat drawCircle(vec2 pt, vec2 circlePosition, float circleSize){\n  if (distance(pt, circlePosition) < circleSize){\n    return distance(pt, circlePosition) / circleSize;\n  }\n  return 0.0;\n}\n\nvoid main(){\n  vec4 returnMe = vec4(0.0);\n\n  float bass   = band(0.03) * sens;\n  float treble = band(0.70) * sens;\n\n  if (PASSINDEX == 0){\n    // --- the memory: shift the conveyor belt, write the new head at slot 0 ---\n    vec2 loc = isf_FragNormCoord.xy;\n    float val = 1.0 / floor(trailCount);\n\n    if (loc.x < val){\n      // autopilot path: layered lissajous + noise wander\n      float T = TIME * moveSpeed;\n      vec2 autoPos = vec2(\n        0.5 + 0.32 * sin(T + 0.8*sin(T*0.63)),\n        0.5 + 0.32 * cos(T*1.31 + 0.6*sin(T*0.47))\n      );\n      autoPos += (vec2(vnoise(T*0.9), vnoise(T*0.9 + 31.7)) - 0.5) * wander * 2.0;\n\n      vec2 head = mix(pointInput, autoPos, autoMove);\n      // treble kicks the head around\n      head += (vec2(hash(vec2(TIME, 1.0)), hash(vec2(TIME, 2.0))) - 0.5) * treble * jitterAmt;\n      head = clamp(head, 0.0, 1.0);\n\n      returnMe = vec4(head.x, head.y, 1.0, 1.0);\n    }\n    else {\n      loc.x = loc.x - val;\n      returnMe = IMG_NORM_PIXEL(pointsBuffer, loc);\n    }\n  }\n  else if (PASSINDEX == 1){\n    // --- the draw: stamp a circle at every remembered position ---\n    float inCircle = 0.0;\n    float aspectRatio = RENDERSIZE.x / RENDERSIZE.y;\n    vec2 loc = isf_FragNormCoord * aspectRatio;\n    float trailFloor = floor(trailCount);\n    int j = 0;\n    float val = 1.0 / (trailFloor - 1.0);\n\n    float pulse = 1.0 + bass * sizePulse;\n\n    for (int i = 0; i < 64; ++i){\n      float fi = float(i);\n      float cSize = mix(startSize, endSize, fi / trailFloor) * pulse;\n      vec2 pos = vec2(fi * val, 0.5);\n      vec4 ptInfo = IMG_NORM_PIXEL(pointsBuffer, pos);\n      if (ptInfo.g > 0.0)\n        inCircle += drawCircle(loc, ptInfo.xy * aspectRatio, cSize);\n\n      if (inCircle > 0.0){ j = i; break; }\n      if (i >= int(trailFloor)){ j = i; break; }\n    }\n\n    if (inCircle > 0.0){\n      returnMe = mix(startColor, endColor, float(j) / trailFloor);\n      if ((strokeSize > 0.0) && (inCircle > 1.0 - strokeSize)){\n        returnMe = strokeColor;\n      }\n    }\n    else {\n      returnMe = bgColor;\n    }\n    // pickers sometimes hand back alpha 0 -> blank screen; ignore their alpha\n    returnMe = vec4(returnMe.rgb, 1.0);\n  }\n\n  gl_FragColor = returnMe;\n}\n"}, {"id": "OOAK_ChamberBubblesCut", "title": "CHAMBER :: BUBBLES CUT", "date": "2026.07.18", "origin": "the entities-free chamber, per bubbles' request. line boil, overdraw strokes, sub-bass bounce, per-parameter frequency patch bay.", "tags": ["architecture", "line-boil", "freq-patch", "commission"], "hero": false, "src": "/*{\n  \"DESCRIPTION\": \"Recursive Chamber - Bubbles Cut v2. Nested frames + big X with LINE BOIL (hand-drawn wobble re-rolled per held frame) and overdraw sketch strokes. Every reactive param has its o const FFT_SIZE = 256;

  data: new Uint8Array(FFT_SIZE),
  mic: null, analyser: null, micOn: false, t0: performance.now(),
  update(){
    if (this.micOn && this.analyser){
      const raw = new Uint8Array(this.analyser.frequencyBinCount);
      this.analyser.getByteFrequencyData(raw);
      for (let i=0;i<FFT_SIZE;i++)
        this.data[i] = raw[Math.min(raw.length-1, Math.floor(i*raw.length/FFT_SIZE))];
    } else {
      const t = (performance.now()-this.t0)/1000;
      for (let i=0;i<FFT_SIZE;i++){
        const x = i/FFT_SIZE;
        const bass = 200*Math.exp(-Math.pow((x-0.04)/0.05,2)) * (0.55+0.45*Math.sin(t*2.2));
        const mid  = 130*Math.exp(-Math.pow((x-0.28)/0.10,2)) * (0.5+0.5*Math.sin(t*1.3+1.7));
        const high = 110*Math.exp(-Math.pow((x-0.68)/0.16,2)) * (0.5+0.5*Math.sin(t*3.1+0.4));

    }
  },
  level(){
    let s=0; for (let i=0;i<FFT_SIZE;i++) s+=this.data[i];

    if (this.micOn){ this.micOn=false; btn.classList.remove('on');

    try{
      if (!this.analyser){
        const stream = await navigator.mediaDevices.getUserMedia({audio:{
          echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
        const ac = new (window.AudioContext||window.webkitAudioContext)();
        const src = ac.createMediaStreamSource(stream);

        src.connect(this.analyser);

const VSRC = "attribute vec2 p; varying vec2 isf_FragNormCoord;" +
  "void main(){ isf_FragNormCoord = p*0.5+0.5; gl_Position = vec4(p,0.0,1.0); }";

const PRELUDE = [
  "#ifdef GL_FRAGMENT_PRECISION_HIGH", "precision highp float;",
  "#else", "precision mediump float;", "#endif",
  "uniform vec2 RENDERSIZE;",
  "uniform float TIME;",
  "uniform int PASSINDEX;",
  "varying vec2 isf_FragNormCoord;",
  "#define IMG_NORM_PIXEL(img,c) texture2D(img,c)",
  "#define IMG_PIXEL(img,c) texture2D(img,(c)/RENDERSIZE)",

function parseISF(src){
  const a = src.indexOf("/*{"), b = src.indexOf("}*/");
  if (a<0 || b<0) throw new Error("no ISF header");
  const header = JSON.parse(src.slice(a+2, b+1));
  const body = src.slice(b+3);
  return { header, body };

class ISFRuntime {

        case "color":   decls += "uniform vec4 "+inp.NAME+";\n";
          this.values[inp.NAME] = (inp.DEFAULT||[1,1,1,1]).slice(); break;
        case "point2D": decls += "uniform vec2 "+inp.NAME+";\n";
          this.values[inp.NAME] = (inp.DEFAULT||[0.5,0.5]).slice(); break;
        case "bool":    decls += "uniform bool "+inp.NAME+";\n";

    if (this.running) return;
    this.running = true;
    this.lastT = performance.now();
    requestAnimationFrame(t=>this.tick(t));
  }
  stop(){ this.running = false; }
}

/* ================= PAGE BUILD ================= */
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const grid = document.getElementById('grid');
const runtimes = [];

function fmtVal(v, inp){
  const span = (inp.MAX||1)-(inp.MIN||0);
  return (span >= 20) ? v.toFixed(0) : v.toFixed(2);
}

function buildCard(sh){
  const card = document.createElement('article');
  card.className = 'card';

  const view = document.createElement('div'); view.className='view';
  const canvas = document.createElement('canvas');
  canvas.width = 480; canvas.height = 360;
  view.appendChild(canvas);
  const paused = document.createElement('div');
  paused.className='paused'; paused.textContent='tap to run';
  view.appendChild(paused);
  card.appendChild(view);

  const body = document.createElement('div'); body.className='body';
  body.innerHTML =
    '<h2>'+sh.title.replace('::','<span class="x">::</span>')+'</h2>' +
    '<div class="date">'+sh.date+'</div>' +
    '<div class="origin">'+sh.origin+'</div>' +
    '<div class="tags">'+sh.tags.map(t=>'<span class="tag">'+t+'</span>').join('')+'</div>';

  const row = document.createElement('div'); row.className='row';
  const copyB = document.createElement('button');
  copyB.className='btn'; copyB.type='button'; copyB.textContent='copy .fs';
  copyB.addEventListener('click', async ()=>{
    try{ await navigator.clipboard.writeText(sh.src);
      copyB.textContent='copied'; copyB.classList.add('done'); }
    catch(e){ copyB.textContent='select+copy failed'; }
    setTimeout(()=>{ copyB.textContent='copy .fs'; copyB.classList.remove('done'); }, 1400);
  });
  const dlB = document.createElement('button');
  dlB.className='btn'; dlB.type='button'; dlB.textContent='download';
  dlB.addEventListener('click', ()=>{
    const blob = new Blob([sh.src], {type:'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = sh.id + '.fs';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  });
  row.appendChild(copyB); row.appendChild(dlB);
  body.appendChild(row);

  // runtime
  let rt = null;
  try{
    rt = new ISFRuntime(canvas, sh.src);
    runtimes.push(rt);
  }catch(e){
    paused.textContent = 'preview unavailable';
    console.error(sh.id, e);
  }

  // params drawer (float + color)
  if (rt){
    const ctl = (rt.inputs||[]).filter(i=>i.TYPE==='float'||i.TYPE==='color');
    if (ctl.length){
      const det = document.createElement('details');
      const sum = document.createElement('summary');
      sum.textContent = 'params ('+ctl.length+')';
      det.appendChild(sum);
      for (const inp of ctl){
        const rowP = document.createElement('div'); rowP.className='param';
        const lab = document.createElement('label');
        lab.textContent = inp.LABEL || inp.NAME;
        rowP.appendChild(lab);
        if (inp.TYPE==='float'){
          const r = document.createElement('input');
          r.type='range';
          r.min = inp.MIN!==undefined?inp.MIN:0;
          r.max = inp.MAX!==undefined?inp.MAX:1;
          r.step = ((r.max-r.min)/200)||0.01;
          r.value = rt.values[inp.NAME];
          const v = document.createElement('span'); v.className='v';
          v.textContent = fmtVal(parseFloat(r.value), inp);
          r.addEventListener('input', ()=>{
            rt.values[inp.NAME] = parseFloat(r.value);
            v.textContent = fmtVal(parseFloat(r.value), inp);
          });
          rowP.appendChild(r); rowP.appendChild(v);
        } else {
          const c = document.createElement('input');
          c.type='color';
          const d = rt.values[inp.NAME];
          c.value = '#'+[0,1,2].map(i=>Math.round((d[i]||0)*255)
            .toString(16).padStart(2,'0')).join('');
          c.addEventListener('input', ()=>{
            const hex = c.value;
            rt.values[inp.NAME] = [1,3,5].map(i=>
              parseInt(hex.slice(i,i+2),16)/255).concat([1]);
          });
          const v = document.createElement('span'); v.className='v'; v.textContent='';
          rowP.appendChild(c); rowP.appendChild(v);
        }
        det.appendChild(rowP);
      }
      body.appendChild(det);
    }
  }

  card.appendChild(body);

  // play/pause behavior
  const setRun = (on)=>{
    if (!rt) return;
    if (on){ rt.start(); paused.style.display='none'; }
    else { rt.stop(); paused.style.display='flex'; }
  };
  view.addEventListener('click', ()=> setRun(!rt || !rt.running ? true : false));
  view.addEventListener('keydown', e=>{
    if (e.key==='Enter'||e.key===' '){ e.preventDefault();
      setRun(!rt || !rt.running); }
  });
  view.tabIndex = 0;

  // pause offscreen, autoplay in view unless reduced motion
  if (rt && 'IntersectionObserver' in window){
    const io = new IntersectionObserver(es=>{
      for (const e of es){
        if (e.isIntersecting && !reduced) setRun(true);
        else if (!e.isIntersecting) setRun(false);
      }
    }, {threshold: 0.15});
    io.observe(view);
  } else if (rt && !reduced){
    setRun(true);
  }

  return card;
}

for (const sh of SHADERS) grid.appendChild(buildCard(sh));
document.getElementById('count').textContent =
  SHADERS.length + ' instruments and counting';

/* ---------- hero: newest emotional favorite, running big ---------- */
let hero = null;
(function(){
  const c = document.getElementById('heroCanvas');
  const fit = ()=>{ c.width = Math.min(1280, c.clientWidth||innerWidth);
    c.height = Math.round(c.width * (c.clientHeight||400) /
      Math.max(1,(c.clientWidth||innerWidth))); };
  fit(); addEventListener('resize', fit);
  const pick = SHADERS.find(s=>s.hero) || SHADERS[SHADERS.length-1];
  try{
    hero = new ISFRuntime(c, pick.src);
    if (!reduced) hero.start();
  }catch(e){ console.error('hero', e); }
})();

/* ---------- shared clock: audio + meter ---------- */
const meter = document.getElementById('meter');
const micBtn = document.getElementById('micBtn');
micBtn.addEventListener('click', ()=> Audio_.toggleMic(micBtn));
(function loop(){
  Audio_.update();
  const lvl = Audio_.level();
  const n = Math.max(0, Math.min(12, Math.floor(lvl/13)));
  meter.textContent = 'in:['+'#'.repeat(n)+'-'.repeat(12-n)+'] '+lvl.toFixed(0)
    + (Audio_.micOn ? '  MIC LIVE' : '  SIM');
  requestAnimationFrame(loop);
})();

document.addEventListener('visibilitychange', ()=>{
  const hide = document.hidden;
  for (const rt of runtimes) if (hide) rt.stop();
  if (hero){ hide ? hero.stop() : (!reduced && hero.start()); }
});
</script>
</body>
